:3","w":"WSC 87 “Repentance unto life is a saving grace, whereby a sinner, out of a true sense of his sin, and apprehension of the mercy of God in Christ, doth, with grief and hatred of his sin, turn from it unto God, with full purpose of, and endeavor after, new obedience” · WCF 15.1–3 · WLC 76"},{"n":52,"s":"II","t":"The Day of the Lord","blocks":[["P",["The Day of the LORD is the time when God intervenes decisively to judge his enemies and vindicate his people. Israel assumed it would bring only blessing, but Amos warned that for a sinful Israel it would be darkness, not light (Amos 5:18–20). The prophets describe it as a day of wrath, darkness, and cosmic upheaval (Joel 2:1–2, 30–31; Zeph 1:14–18), and also of salvation for all who call on the LORD’s name (Joel 2:32). It had near fulfillments, such as the fall of Jerusalem (Lam 2:22), and points to a final day. The New Testament sees it begun at Pentecost (Acts 2:16–21) and consummated at Christ’s return (1 Thess 5:2; 2 Pet 3:10)."]]],"q":"Amos 5:18 | Woe to you who desire the day of the LORD! Why would you have the day of the LORD? It is darkness, and not light,","sc":"Isa 2:12–22; 13:6–13; Joel 1:15; 2:1–2, 28–32; Amos 5:18–20; Obad 15; Zeph 1:14–18; Mal 4:1–6; Acts 2:16–21; 1 Thess 5:2; 2 Pet 3:10","w":"WCF 33.1 “God hath appointed a day wherein he will judge the world in righteousness by Jesus Christ” · WCF 33.3 (the day is kept unknown “that they may shake off all carnal security, and be always watchful”) · WLC 88–90"},{"n":53,"s":"II","t":"The Remnant","blocks":[["P",["God’s judgments never wipe out his people entirely. A remnant survives, purified by judgment, as the bearer of the promise. In Elijah’s day God kept seven thousand who had not bowed to Baal (1 Kgs 19:18). Isaiah named a son Shear-jashub, “a remnant shall return” (Isa 7:3; 10:20–22), and the returning exiles saw themselves as that remnant (Ezra 9:8, 13–15; Hag 1:12). The remnant is marked by humble faith, not by ancestry alone (Zeph 3:12–13). Paul applies the doctrine to the church: “So too at the present time there is a remnant, chosen by grace” (Rom 11:5)."]]],"q":"Isa 10:21 | A remnant will return, the remnant of Jacob, to the mighty God.","sc":"1 Kgs 19:18; Isa 1:9; 6:13; 7:3; 10:20–22; 11:11–16; Jer 23:3; Mic 2:12; 4:6–7; Zeph 3:12–13; Rom 9:27–29; 11:1–6","w":"WCF 25.4 “This catholic Church hath been sometimes more, sometimes less visible” (proof: Rom 11:3–4) · WCF 25.5 “there shall be always a Church on earth to worship God according to his will” · WCF 17.2 (perseverance rests on “the immutability of the decree of election”)"},{"n":54,"s":"II","t":"The Servant","blocks":[["P",["In Isaiah 40–55 “the servant of the LORD” first names Israel, chosen but blind and deaf (Isa 41:8–9; 42:18–19). Then a single Servant emerges who will restore Israel and be a light to the nations (49:3–6). The four Servant Songs (42:1–9; 49:1–13; 50:4–11; 52:13–53:12) describe him as Spirit-anointed, gentle, and obedient through suffering. The last presents him as the righteous one who bears the sins of many, makes his life an offering for guilt, and then sees his offspring and prolongs his days (53:10–12). The New Testament identifies the Servant as Jesus (Matt 12:17–21; Acts 8:32–35; 1 Pet 2:22–25)."]]],"q":"Isa 53:5 | But he was pierced for our transgressions; he was crushed for our iniquities; upon him was the chastisement that brought us peace, and with his wounds we are healed.","sc":"Isa 42:1–9; 49:1–13; 50:4–11; 52:13–53:12; Matt 8:17; 12:17–21; Luke 22:37; Acts 8:32–35; Phil 2:7; 1 Pet 2:22–25","w":"WCF 11.3 (Christ made “a proper, real, and full satisfaction to his Father’s justice,” proofs include Isa 53:4–6, 10–12) · WCF 8.4 “This office the Lord Jesus did most willingly undertake” · WSC 27 “Christ’s humiliation consisted in his being born, and that in a low condition” · WLC 71"},{"n":55,"s":"II","t":"The Messiah","blocks":[["P",["“Messiah” means “anointed one.” Prophets, priests, and kings were anointed for office, and the prophets’ hope centers on a coming anointed King from David’s line. He will be born in Bethlehem (Mic 5:2), bear divine titles (Isa 9:6), rule in righteousness with the Spirit resting on him (Isa 11:1–5; Jer 23:5–6), come humble on a donkey (Zech 9:9), and be “cut off” (Dan 9:26). Psalms 2 and 110 present him as God’s Son and as a priest-king at God’s right hand. The New Testament proclaims that Jesus is this Christ, anointed by the Spirit (Luke 4:18–21; Acts 2:36; 10:38)."]]],"q":"Isa 9:6 | For to us a child is born, to us a son is given; and the government shall be upon his shoulder, and his name shall be called Wonderful Counselor, Mighty God, Everlasting Father, Prince of Peace.","sc":"2 Sam 7:12–16; Ps 2; 110; Isa 9:6–7; 11:1–10; Jer 23:5–6; Mic 5:2–5; Zech 9:9; Dan 9:25–26; Luke 4:18–21; John 1:41; Acts 2:36","w":"WLC 42 “Our Mediator was called Christ, because he was anointed with the Holy Ghost above measure, and so set apart, and fully furnished with all authority and ability, to execute the offices of prophet, priest, and king of his church” · WSC 23 · WCF 8.1, 8.3"},{"n":56,"s":"II","t":"New Covenant","blocks":[["P",["Jeremiah promised a new covenant with the house of Israel and Judah, unlike the Sinai covenant they broke (Jer 31:31–34). God would write his law on their hearts, all would know him from the least to the greatest, and he would forgive their sins and remember them no more. Ezekiel adds the gift of a new heart and God’s own Spirit, who causes his people to walk in his statutes (Ezek 36:25–27), and calls it an everlasting covenant of peace (37:26). The new covenant is the covenant of grace in its final and fuller administration. Jesus inaugurated it in his blood (Luke 22:20), and Hebrews 8 quotes Jeremiah in full to show that Christ mediates a better covenant enacted on better promises."]]],"q":"Jer 31:33 | For this is the covenant that I will make with the house of Israel after those days, declares the LORD: I will put my law within them, and I will write it on their hearts. And I will be their God, and they shall be my people.","sc":"Jer 31:31–34; 32:38–40; Ezek 11:19–20; 36:25–27; 37:26; Isa 59:21; Luke 22:20; 2 Cor 3:3–18; Heb 8:6–13; 10:15–18","w":"WCF 7.6 “There are not, therefore, two covenants of grace differing in substance, but one and the same under various dispensations” (proofs include Jer 31:33–34) · WLC 35 “held forth in more fulness, evidence, and efficacy, to all nations” · WCF 10.1 “taking away their heart of stone, and giving unto them an heart of flesh” (proof: Ezek 36:26)"},{"n":57,"s":"III","t":"The Message of Job","blocks":[["P",["Job was blameless and upright, and God allowed Satan to test whether Job feared God “for no reason” (Job 1:9) by taking his wealth, his children, and his health. Job’s friends insisted that suffering always proves particular sin, and God later said they had not spoken of him what was right (42:7). Job protested his innocence and demanded a hearing, yet clung to God (13:15; 19:25–27). God answered from the whirlwind, not by explaining the reason for Job’s suffering, but by displaying his own wisdom and sovereignty over creation (Job 38–41). Job repented of speaking beyond his knowledge (42:1–6), and God restored him (42:10–17). The message is that God is sovereign, wise, and good even when his reasons are hidden, and that true faith fears God for who he is, not for what he gives."]]],"q":"Job 1:21 | And he said, “Naked I came from my mother’s womb, and naked shall I return. The LORD gave, and the LORD has taken away; blessed be the name of the LORD.”","sc":"Job 1–2; 9:32–33; 13:15; 19:25–27; 28:28; 38–42; Jas 5:11","w":"WCF 5.1 (providence, proofs include Job 38–41) · WCF 5.5 (God tries his children “for sundry other just and holy ends”) · WLC 81 (assurance may be weakened “through manifold distempers, sins, temptations, and desertions”)","c":"Job’s longing for an arbiter (9:33) and a living Redeemer (19:25) is answered in Christ, the righteous sufferer whom God vindicated (1 Pet 2:23; Jas 5:11)."},{"n":58,"s":"III","t":"A Psalm for Each Category","blocks":[["T",["Category | Psalm | Why it fits","Wisdom | Psalm 1 | Contrasts the two ways: the righteous who delight in God’s law and the wicked who perish. (Also 37, 49, 73, 112, 119.)","Praise | Psalm 103 | Calls the soul to bless the LORD for all his benefits and his steadfast love. (Also 100, 145–150.)","Lament | Psalm 13 | “How long, O LORD?” Moves from complaint to petition to trust. (Also 22, 42–43, 88. Communal: 44, 74, 80.)","Royal | Psalm 2 | The LORD’s anointed King and Son reigns over the raging nations. (Also 45, 72, 89, 110.)","Thanksgiving | Psalm 30 | Thanks for deliverance from death: “Weeping may tarry for the night, but joy comes with the morning.” (Also 32, 34, 116, 118. Communal: 107, 124.)","Pilgrimage | Psalm 121 | A Song of Ascents, sung going up to Jerusalem for the feasts: “My help comes from the LORD.” (Psalms 120–134.)","Imprecatory | Psalm 137 | Asks God to repay Edom and Babylon for Jerusalem’s destruction. (Also 35, 58, 69, 109.)"]],["P",["The imprecatory psalms commit vengeance to God (Rom 12:19) and plead for his justice against unrepentant enemies of his kingdom. The New Testament applies Psalms 69 and 109 to Judas and to Christ’s enemies (Acts 1:20; Rom 11:9–10)."]]],"sc":"Ps 1; 2; 13; 30; 103; 121; 137; Luke 24:44; Eph 5:19; Col 3:16","w":"WCF 21.5 (“singing of psalms with grace in the heart” is part of the ordinary worship of God) · WLC 186 “The whole Word of God is of use to direct us in the duty of prayer”"},{"n":59,"s":"III","t":"Biblical Wisdom and Its Source","blocks":[["P",["Biblical wisdom is skill in living according to God’s created order and revealed will. It is practical godliness, knowing how to speak, work, handle money, raise children, and choose companions in the fear of the LORD. It is not mere intelligence or cleverness. Its beginning and foundation is the fear of the LORD, a reverent and trusting submission to him (Prov 1:7; 9:10; Job 28:28). Its source is God himself, who gives it to those who ask (Prov 2:6; Jas 1:5), and Proverbs pictures wisdom as present with God at creation (Prov 8:22–31). In the New Testament, Christ is “the wisdom of God” (1 Cor 1:24, 30), in whom are hidden all its treasures (Col 2:3)."]]],"q":"Prov 9:10 | The fear of the LORD is the beginning of wisdom, and the knowledge of the Holy One is insight.","sc":"Job 28:12–28; Ps 111:10; Prov 1:1–7; 2:1–6; 8:22–36; 9:10; Jas 1:5; 3:13–18; 1 Cor 1:18–31; Col 2:3","w":"WCF 8.3 (Christ has in him “all the treasures of wisdom and knowledge,” proof: Col 2:3) · WSC 4 (God is infinite, eternal, and unchangeable “in his being, wisdom, power”) · WLC 104 (the first commandment requires “fearing of him”)"},{"n":60,"s":"III","t":"Ecclesiastes: Major Theme and How to Live","blocks":[["P",["The major theme is that life “under the sun,” viewed apart from God, is hebel, rendered “vanity” in the ESV: a breath or vapor, fleeting, elusive, and beyond human mastery. Wisdom, pleasure, work, and wealth cannot secure lasting gain. Death comes to wise and fool alike, and much of God’s providence is hidden from us (Eccl 1:2–11; 2:12–23; 3:11; 8:16–17). The Preacher’s counsel is to fear God and keep his commandments, knowing that God will bring every deed into judgment (12:13–14). Meanwhile the believer is to receive food, drink, work, and marriage with joy as God’s gifts (2:24–26; 3:12–13; 5:18–20; 9:7–10), remember his Creator in youth (12:1), and accept both prosperity and adversity from God’s hand (7:14)."]]],"q":"Eccl 12:13 | The end of the matter; all has been heard. Fear God and keep his commandments, for this is the whole duty of man.","sc":"Eccl 1:2; 2:24–26; 3:1–14; 5:1–7, 18–20; 7:13–14; 9:7–10; 11:9–12:14; Rom 8:20–21","w":"WSC 1 “Man’s chief end is to glorify God, and to enjoy him for ever” · WCF 33.1 (all shall give account “of their thoughts, words, and deeds”) · WLC 193 (the “holy and comfortable use” of God’s gifts, with “contentment in them”)","c":"Paul says creation “was subjected to futility” in hope (Rom 8:20). Because Christ is risen, the believer’s labor “in the Lord” is not in vain (1 Cor 15:58)."},{"n":61,"s":"III","t":"The Primary Purpose of Song of Solomon","blocks":[["P",["The primary purpose of the Song is to celebrate the love, desire, and delight of a man and a woman in exclusive, covenantal marriage as God’s good gift, recovering the unashamed joy of Gen 2:23–25 in a fallen world. It honors romantic and physical love while guarding it, with the refrain charging “that you not stir up or awaken love until it pleases” (2:7; 3:5; 8:4). Its climax praises love as strong as death and worth more than all wealth (8:6–7). The church has also long read the Song as a picture of the love between Christ and his church. The Westminster divines did so, citing it as a proof text for effectual calling and spiritual desertion (WCF 10.1; 18.4), a reading anchored in the marriage-mystery of Eph 5:31–32."]]],"q":"Song 8:6 | Set me as a seal upon your heart, as a seal upon your arm, for love is strong as death, jealousy is fierce as the grave. Its flashes are flashes of fire, the very flame of the LORD.","sc":"Gen 2:23–25; Prov 5:15–19; Song 2:7; 3:5; 8:4, 6–7; Eph 5:25–33; Heb 13:4","w":"WCF 24.2 “Marriage was ordained for the mutual help of husband and wife” · WLC 138 (the seventh commandment requires “conjugal love, and cohabitation”) · WCF 10.1 (proof: Song 1:4) · WCF 17.3 (proofs include Song 5:2–4, 6) · WCF 18.4 (proofs include Song 5:2–3, 6)"}],"qs":[{"t":"fill","e":1,"src":"WSC 9","q":"The work of creation is, God’s making all things of ___, by the word of his power, in the space of six days, and all very good.","a":"nothing","d":["dust","light","his own being"],"x":""},{"t":"mc","e":1,"q":"Which Persons of the Godhead does WCF 4.1 name as Creator?","a":"Father, Son, and Holy Ghost","d":["The Father alone","The Son alone","The Father and the Son"],"x":"WCF 4.1 opens, “It pleased God the Father, Son, and Holy Ghost.”"},{"t":"mc","e":1,"q":"What did the PCA Creation Study Committee (2000) conclude about the creation days?","a":"It could not reach unanimity on their nature and duration","d":["It required the calendar-day view","It rejected the framework view","It adopted the day-age view"],"x":"The report set out four views held in the PCA: calendar-day, day-age, framework, and analogical."},{"t":"mc","e":1,"q":"Which verse names the Son as the agent through whom all things were made?","a":"John 1:3","d":["John 3:16","Romans 8:28","Hebrews 11:1"],"x":"Col 1:16–17 says the same. In him all things hold together.","v":[["John 1:3","All things were made through him, and without him was not any thing made that was made."],["Col 1:16–17","For by him all things were created, in heaven and on earth, visible and invisible, whether thrones or dominions or rulers or authorities—all things were created through him and for him. And he is before all things, and in him all things hold together."]]},{"t":"fill","e":2,"src":"WSC 10","q":"God created man male and female, after his own image, in knowledge, righteousness, and ___, with dominion over the creatures.","a":"holiness","d":["wisdom","immortality","freedom"],"x":""},{"t":"fill","e":2,"src":"ESV Gen 1:27","q":"So God created man in his own image, in the image of God he created him; ___ he created them.","a":"male and female","d":["in righteousness","from the dust","to rule"],"x":""},{"t":"mc","e":2,"q":"Why does Genesis 9:6 forbid murder?","a":"God made man in his own image","d":["Blood belongs to the altar","Cain had killed Abel","Noah had offered sacrifice"],"x":"The fall defaced the image but did not erase it.","v":[["Gen 9:6","Whoever sheds the blood of man, by man shall his blood be shed, for God made man in his own image."]]},{"t":"mc","e":2,"q":"Who is “the image of the invisible God” (Col 1:15)?","a":"Christ","d":["Adam","The church","Every believer"],"x":"Believers are being conformed to his image (Rom 8:29).","v":[["Col 1:15","He is the image of the invisible God, the firstborn of all creation."],["Rom 8:29","For those whom he foreknew he also predestined to be conformed to the image of his Son, in order that he might be the firstborn among many brothers."]]},{"t":"mc","e":2,"q":"Did the fall erase the image of God in man?","a":"No. It defaced the image without erasing it","d":["Yes. It was wholly lost","Only baptism restores it","No. The fall left it untouched"],"x":"That is why murder and cursing still assault God’s image (Gen 9:6, Jas 3:9).","v":[["Gen 9:6","Whoever sheds the blood of man, by man shall his blood be shed, for God made man in his own image."],["Jas 3:9","With it we bless our Lord and Father, and with it we curse people who are made in the likeness of God."]]},{"t":"fill","e":3,"src":"WSC 12","q":"When God had created man, he entered into a covenant of ___ with him, upon condition of perfect obedience...","a":"life","d":["grace","peace","promise"],"x":""},{"t":"fill","e":3,"src":"WLC 22","q":"The covenant being made with Adam as a ___ person, not for himself only, but for his posterity...","a":"public","d":["private","perfect","holy"],"x":""},{"t":"mc","e":3,"q":"According to WLC 20, what was the pledge of the covenant of life?","a":"The tree of life","d":["The rainbow","The Sabbath","Circumcision"],"x":"WLC 20: “of which the tree of life was a pledge.”"},{"t":"mc","e":3,"q":"Which passage sets Adam and Christ side by side as covenant heads?","a":"Romans 5:12–21","d":["Romans 8:1–11","Galatians 5:16–26","Ephesians 2:11–22"],"x":"Christ, the last Adam, kept the covenant Adam broke.","v":[["Rom 5:18–19","Therefore, as one trespass led to condemnation for all men, so one act of righteousness leads to justification and life for all men. For as by the one man’s disobedience the many were made sinners, so by the one man’s obedience the many will be made righteous."]]},{"t":"mc","e":3,"q":"On what condition did the covenant of works promise life (WCF 7.2)?","a":"Perfect and personal obedience","d":["Faith in the promised Seed","Circumcision","A yearly sacrifice"],"x":"WCF 7.2: “upon condition of perfect and personal obedience.”"},{"t":"mc","e":4,"q":"Which verse is the classic statement of the cultural mandate?","a":"Genesis 1:28","d":["Genesis 2:24","Genesis 9:6","Genesis 12:2"],"x":"“Be fruitful and multiply and fill the earth and subdue it.”","v":[["Gen 1:28","And God blessed them. And God said to them, “Be fruitful and multiply and fill the earth and subdue it, and have dominion over the fish of the sea and over the birds of the heavens and over every living thing that moves on the earth.”"]]},{"t":"fill","e":4,"src":"WLC 20","q":"The providence of God toward man in the estate in which he was created, was the placing him in paradise, appointing him to ___ it...","a":"dress","d":["name","guard","fill"],"x":""},{"t":"mc","e":4,"q":"Where is the cultural mandate restated after the flood?","a":"Genesis 9:1–7","d":["Genesis 11:1–9","Genesis 12:1–3","Genesis 8:20–22"],"x":"It is now carried out under the curse on the ground.","v":[["Gen 9:1","And God blessed Noah and his sons and said to them, “Be fruitful and multiply and fill the earth."]]},{"t":"mc","e":4,"q":"Which New Testament passage applies Psalm 8’s dominion to Jesus?","a":"Hebrews 2:5–9","d":["Hebrews 11:1–3","Romans 8:18–25","Colossians 3:1–4"],"x":"The dominion Adam forfeited is fulfilled in the crowned Son of Man.","v":[["Ps 8:6","You have given him dominion over the works of your hands; you have put all things under his feet,"],["Heb 2:9","But we see him who for a little while was made lower than the angels, namely Jesus, crowned with glory and honor because of the suffering of death, so that by the grace of God he might taste death for everyone."]]},{"t":"mc","e":4,"q":"Which of these did God ordain before the fall?","a":"Marriage, labor, and the Sabbath","d":["Sacrifice, priesthood, and temple","Circumcision and Passover","Kingship and the law of the king"],"x":"WLC 20 lists dressing the garden, marriage, and the Sabbath in man’s first estate."},{"t":"fill","e":5,"src":"WSC 17","q":"The fall brought mankind into an estate of ___.","a":"sin and misery","d":["guilt and shame","death and corruption","sin and bondage"],"x":""},{"t":"fill","e":5,"src":"WSC 14","q":"Sin is any want of ___ unto, or transgression of, the law of God.","a":"conformity","d":["obedience","love","faith"],"x":""},{"t":"fill","e":5,"src":"WSC 18","q":"...the corruption of his whole nature, which is commonly called ___...","a":"original sin","d":["total depravity","actual sin","concupiscence"],"x":""},{"t":"mc","e":5,"q":"By what does WSC 16 say all mankind descends from Adam, and so sinned in him?","a":"Ordinary generation","d":["Natural law","Imitation of his example","Covenant election"],"x":"WSC 16: “all mankind, descending from him by ordinary generation, sinned in him.”"},{"t":"mc","e":5,"q":"Whose sin is imputed to all mankind (WCF 6.3)?","a":"Adam’s first sin","d":["Cain’s murder","Each parent’s sins","The sins of the flood generation"],"x":"Adam and Eve were the root of all mankind."},{"t":"fill","e":6,"src":"ESV Gen 3:15","q":"I will put enmity between you and the woman, and between your offspring and her offspring; he shall bruise your ___, and you shall bruise his heel.","a":"head","d":["seed","name","house"],"x":""},{"t":"fill","e":6,"src":"WCF 8.6","q":"...the seed of the woman which should bruise the ___ head...","a":"serpent’s","d":["dragon’s","devil’s","enemy’s"],"x":""},{"t":"mc","e":6,"q":"What is Genesis 3:15 often called?","a":"The protoevangelium, the first gospel","d":["The Shema","The Great Commission","The Aaronic blessing"],"x":"It is the first gospel promise, spoken in the curse on the serpent.","v":[["Gen 3:15","I will put enmity between you and the woman, and between your offspring and her offspring; he shall bruise your head, and you shall bruise his heel."]]},{"t":"mc","e":6,"q":"In Genesis 3:15, who puts enmity between the serpent and the woman?","a":"God himself","d":["The woman","Adam","The angels"],"x":"So the human race is not left in league with Satan.","v":[["Gen 3:15","I will put enmity between you and the woman, and between your offspring and her offspring; he shall bruise your head, and you shall bruise his heel."]]},{"t":"mc","e":6,"q":"In Genesis 3:15, what does the bruised heel point to?","a":"The cross","d":["The flood","The exile","The fall itself"],"x":"Christ destroyed the devil through death (Heb 2:14).","v":[["Gen 3:15","I will put enmity between you and the woman, and between your offspring and her offspring; he shall bruise your head, and you shall bruise his heel."],["Heb 2:14","Since therefore the children share in flesh and blood, he himself likewise partook of the same things, that through death he might destroy the one who has the power of death, that is, the devil,"]]},{"t":"fill","e":7,"src":"ESV Gen 6:5","q":"The LORD saw that the wickedness of man was great in the earth, and that every intention of the thoughts of his heart was only ___ continually.","a":"evil","d":["proud","violent","vain"],"x":""},{"t":"mc","e":7,"q":"What did Noah find, according to Genesis 6:8?","a":"Favor in the eyes of the LORD","d":["A righteous city","Gold in Havilah","A tablet of the law"],"x":"Noah acted in faith (Heb 11:7).","v":[["Gen 6:8","But Noah found favor in the eyes of the LORD."],["Heb 11:7","By faith Noah, being warned by God concerning events as yet unseen, in reverent fear constructed an ark for the saving of his household. By this he condemned the world and became an heir of the righteousness that comes by faith."]]},{"t":"mc","e":7,"q":"Which New Testament text treats the flood as a figure of baptism?","a":"1 Peter 3:20–21","d":["Romans 6:3–4","Colossians 2:11–12","Titus 3:5"],"x":"As the ark carried Noah through judgment, Christ carries his people through the wrath to come.","v":[["1 Pet 3:20–21","because they formerly did not obey, when God’s patience waited in the days of Noah, while the ark was being prepared, in which a few, that is, eight persons, were brought safely through water. Baptism, which corresponds to this, now saves you, not as a removal of dirt from the body but as an appeal to God for a good conscience, through the resurrection of Jesus Christ, ..."]]},{"t":"mc","e":7,"q":"Jesus compared the days of Noah to what (Matt 24:37–39)?","a":"His coming","d":["His baptism","The fall of Babylon","Pentecost"],"x":"The flood warns of the final judgment.","v":[["Matt 24:37–39","For as were the days of Noah, so will be the coming of the Son of Man. For as in those days before the flood they were eating and drinking, marrying and giving in marriage, until the day when Noah entered the ark, and they were unaware until the flood came and swept them all away, so will be the coming of the Son of Man."]]},{"t":"mc","e":7,"q":"The Standards cite Genesis 6:5 to prove what?","a":"Man’s corrupt nature is wholly inclined to all evil","d":["God governs the weather","The Sabbath is a creation ordinance","Baptism replaces circumcision"],"x":"See WCF 6.4 and WLC 25.","v":[["Gen 6:5","The LORD saw that the wickedness of man was great in the earth, and that every intention of the thoughts of his heart was only evil continually."]]},{"t":"mc","e":8,"q":"What sign did God set for the Noahic covenant?","a":"His bow in the cloud","d":["Circumcision","The Sabbath","The tree of life"],"x":"“I have set my bow in the cloud” (Gen 9:13).","v":[["Gen 9:13","I have set my bow in the cloud, and it shall be a sign of the covenant between me and the earth."]]},{"t":"mc","e":8,"q":"With whom did God make the Noahic covenant?","a":"Noah, his descendants, and every living creature","d":["Noah alone","Shem and his line only","Israel at Sinai"],"x":"It is a covenant of preservation with all flesh."},{"t":"mc","e":8,"q":"What did God newly permit Noah in Genesis 9:3?","a":"Animals for food","d":["Building altars","Making images","Marrying foreign wives"],"x":"","v":[["Gen 9:3","Every moving thing that lives shall be food for you. And as I gave you the green plants, I give you everything."]]},{"t":"mc","e":8,"q":"What does Genesis 9:6 institute?","a":"Judicial justice for murder","d":["Tithing of the harvest","A Sabbath year for the land","Cities of refuge"],"x":"The reason given is that man bears God’s image.","v":[["Gen 9:6","Whoever sheds the blood of man, by man shall his blood be shed, for God made man in his own image."]]},{"t":"mc","e":8,"q":"Isaiah uses the Noahic oath to guarantee what (Isa 54:9–10)?","a":"God’s covenant of peace with his people","d":["The return of Elijah","The rebuilding of the temple","The fall of Babylon"],"x":"","v":[["Isa 54:9–10","“This is like the days of Noah to me: as I swore that the waters of Noah should no more go over the earth, so I have sworn that I will not be angry with you, and will not rebuke you. For the mountains may depart and the hills be removed, but my steadfast love shall not depart from you, and my covenant of peace shall not be removed,” says the LORD, who has compassion on you."]]},{"t":"mc","e":8,"q":"What does the Noahic covenant secure (Gen 8:22)?","a":"The regularity of nature","d":["The land of Canaan","A royal line","Forgiveness of sins"],"x":"A stable world is the stage on which redemption unfolds.","v":[["Gen 8:22","While the earth remains, seedtime and harvest, cold and heat, summer and winter, day and night, shall not cease."]]},{"t":"fill","e":9,"src":"ESV Gen 11:4","q":"Come, let us build ourselves a city and a tower with its top in the heavens, and let us make a ___ for ourselves...","a":"name","d":["temple","kingdom","covenant"],"x":""},{"t":"mc","e":9,"q":"Which command did the builders of Babel defy?","a":"Fill the earth (Gen 9:1)","d":["Do not eat blood","Keep the Sabbath","Make no graven image"],"x":"They built so they would not be dispersed.","v":[["Gen 9:1","And God blessed Noah and his sons and said to them, “B function buildOrder(seq, k){

  var pick = shuffle(idx).slice(0, Math.min(k, seq.length)).sort(function(a, b){ return a - b; });
  return {t:'order', items:pick.map(function(i){ return {label:seq[i][0], ref:seq[i][1], rank:i}; })};
}
function compose(pool, n, seq){
  var caps = {who:2, sort:2, fill:3};
  var used = {who:0, sort:0, fill:0, mc:0};
  var out = [], spill = [];
  shuffle(pool).forEach(function(q){
    if(out.length >= n) return;
    if(caps[q.t] !== undefined && used[q.t] >= caps[q.t]){ spill.push(q); return; }
    used[q.t] = (used[q.t] || 0) + 1; out.push(q);
  });
  while(out.length < n && spill.length) out.push(spill.shift());
  if(seq){ out.splice(Math.min(3, out.length), 0, buildOrder(seq, 5)); }
  return out;
}
function startStage(id){
  var st = stageById(id);
  var pool = D.qs.filter(function(q){ var s = stageOf(q.e); return s && s.id === id; });
  var seq = D.seq[String(id)];
  var qs = compose(pool, seq ? 7 : 8, seq);
  S.run = {kind:'stage', stage:id, label:'Stage ' + pad(id), title:st.title, qs:qs, i:0, lamps:3, score:0, streak:0, correct:0, results:[], missed:[]};
  initCur(); go('play');
}
function startReview(){
  var miss = missedList();
  if(!miss.length) return;
  var pool = D.qs.filter(function(q){ return miss.indexOf(q.e) >= 0; });
  var qs = compose(pool, Math.min(8, pool.length), null);
  S.run = {kind:'review', stage:null, label:'Review', title:'Your misses', qs:qs, i:0, lamps:3, score:0, streak:0, correct:0, results:[], missed:[]};
  initCur(); go('play');
}
function initCur(){
  var q = S.run.qs[S.run.i];
  var c = {picked:null, revealed:1, tap:[], checked:false, ok:null};
  if(q.t === 'order'){ c.shown = shuffle(q.items.map(function(_, i){ return i; })); }
  else { c.opts = shuffle([q.a].concat(q.d)); }
  S.run.cur = c;
}
function grade(ok, q, pts){
  var r = S.run;
  r.cur.ok = ok;
  if(ok){ r.streak += 1; r.score += pts * mult(r.streak); r.correct += 1; markHit(q.e); }
  else { r.streak = 0; r.lamps -= 1; markMiss(q.e); if(q.e && r.missed.indexOf(q.e) < 0) r.missed.push(q.e); buzz(); }
  r.results[r.i] = ok;
  persist();
}
function pick(i){
  var r = S.run, q = r.qs[r.i];
  if(r.cur.picked !== null) return;
  r.cur.picked = i;
  var pts = q.t === 'who' ? Math.max(50, 200 - 50 * (r.cur.revealed - 1)) : 100;
  grade(r.cur.opts[i] === q.a, q, pts);
  render(); focusFeedback();
}
function tapOrder(k, cur){
  if(cur.checked) return;
  var at = cur.tap.indexOf(k);
  if(at >= 0) cur.tap = cur.tap.slice(0, at); else cur.tap.push(k);
  render();
}
function scoreOrder(items, cur){
  var right = 0;
  cur.tap.forEach(function(k, pos){ if(items[k].rank === sortedRanks(items)[pos]) right++; });
  return right;
}
function sortedRanks(items){ return items.map(function(it){ return it.rank; }).sort(function(a, b){ return a - b; }); }
function checkOrderQ(){
  var r = S.run, q = r.qs[r.i], c = r.cur;
  if(c.tap.length !== q.items.length || c.checked) return;
  c.checked = true;
  var right = scoreOrder(q.items, c);
  var ok = right === q.items.length;
  if(ok) grade(true, q, 100);
  else { r.score += right * 20; grade(false, q, 0); }
  c.right = right;
  render(); focusFeedback();
}
function nextQ(){
  var r = S.run;
  if(r.lamps <= 0){ finish(false); return; }
  r.i += 1;
  if(r.i >= r.qs.length){ finish(true); return; }
  initCur(); S.quitArmed = false; render(); window.scrollTo(0, 0); focusPrompt();
}
function finish(cleared){
  var r = S.run;
  var res = {kind:r.kind, stage:r.stage, label:r.label, title:r.title, cleared:cleared, score:r.score, correct:r.correct, total:r.results.length, of:r.qs.length, stars:cleared ? r.lamps : 0, missed:r.missed.slice(), at:r.i + 1, newBest:false};
  if(r.kind === 'stage' && cleared){
    var prev = P.stages[r.stage] || {stars:0, best:0};
    res.newBest = r.score > (prev.best || 0);
    P.stages[r.stage] = {stars:Math.max(prev.stars || 0, r.lamps), best:Math.max(prev.best || 0, r.score)};
    persist();
  }
  S.result = res; S.run = null; go('result');
}

/* ---------- blitz ---------- */
function startBlitz(){
  S.blitz = {end:Date.now() + 60000, count:0, wrong:0, deck:shuffle(CHOICE), flash:null, done:false};
  nextBlitzQ(); go('blitz'); startBlitzTimer();
}
function nextBlitzQ(){
  var b = S.blitz;
  if(!b.deck.length) b.deck = shuffle(CHOICE);
  var q = b.deck.pop();
  b.q = q; b.opts = shuffle([q.a, q.d[Math.floor(Math.random() * q.d.length)]]);
}
function startBlitzTimer(){
  stopBlitzTimer();
  blitzTimer = setInterval(function(){
    var b = S.blitz; if(!b || S.screen !== 'blitz') { stopBlitzTimer(); return; }
    var left = Math.max(0, b.end - Date.now());
    var bar = document.querySelector('.timer i'); if(bar) bar.style.transform = 'scaleX(' + (left / 60000) + ')';
    var t = document.getElementById('bt'); if(t) t.textContent = Math.ceil(left / 1000) + 's';
    if(left <= 0){ stopBlitzTimer(); endBlitz(); }
  }, 100);
}
function stopBlitzTimer(){ if(blitzTimer){ clearInterval(blitzTimer); blitzTimer = null; } }
function blitzPick(i){
  var b = S.blitz; if(!b || b.flash || b.done) return;
  var ok = b.opts[i] === b.q.a;
  if(ok){ b.count += 1; markHit(b.q.e); } else { b.wrong += 1; markMiss(b.q.e); buzz(); }
  persist();
  b.flash = {ok:ok, i:i};
  render();
  setTimeout(function(){ if(S.screen !== 'blitz' || S.blitz !== b || b.done) return; b.flash = null; nextBlitzQ(); render(); }, ok ? 300 : 1100);
}
function endBlitz(){
  var b = S.blitz; if(!b || b.done) return;
  b.done = true;
  var best = b.count > (P.blitz || 0);
  if(best){ P.blitz = b.count; persist(); }
  S.result = {kind:'blitz', count:b.count, wrong:b.wrong, newBest:best};
  go('result');
}

/* ---------- timeline ---------- */
function startTimeline(){ S.tl = {round:0, rounds:5, total:0}; newRound(); go('timeline'); }
function newRound(){
  var t = S.tl;
  var o = buildOrder(D.timeline, 5);
  t.items = o.items; t.cur = {tap:[], checked:false, shown:shuffle(o.items.map(function(_, i){ return i; }))};
}
function checkTimeline(){
  var t = S.tl, c = t.cur;
  if(c.tap.length !== t.items.length || c.checked) return;
  c.checked = true; c.right = scoreOrder(t.items, c); t.total += c.right;
  render(); focusFeedback();
}
function nextRound(){
  var t = S.tl;
  t.round += 1;
  if(t.round >= t.rounds){
    var best = t.total > (P.timeline || 0);
    if(best){ P.timeline = t.total; persist(); }
    S.result = {kind:'timeline', total:t.total, max:t.rounds * 5, newBest:best};
    go('result'); return;
  }
  newRound(); render(); window.scrollTo(0, 0);
}

function playBar(label, title, right, back){
  var left = back ? '<button class="quit" data-act="back">Back</button>'
    : '<button class="quit' + (S.quitArmed ? ' armed' : '') + '" data-act="quit">' + (S.quitArmed ? 'Tap to quit' : 'Quit') + '</button>';
  return '<div class="bar">' + left
    + '<div class="bar-mid"><span class="kicker">' + esc(label) + '</span><b>' + esc(title) + '</b></div>' + right + '</div>';

function promptHtml(q, cur){
  if(q.t === 'fill'){
    var parts = esc(q.q).split('___');
    var mid;
    if(cur.picked === null) mid = '<span class="blank" aria-label="blank"> </span>';
    else mid = '<span class="filled' + (cur.ok ? '' : ' bad') + '">' + esc(cur.ok ? q.a : cur.opts[cur.picked]) + '</span>';
    return '<h2 class="prompt quote" tabindex="-1">' + parts[0] + mid + parts[1] + '</h2>';
  }
  if(q.t === 'sort') return '<h2 class="prompt big" tabindex="-1">' + esc(q.q) + '</h2>';
  if(q.t === 'who') return '<h2 class="prompt" tabindex="-1">Name the person from the clues.</h2>';
  return '<h2 class="prompt" tabindex="-1">' + esc(q.q) + '</h2>';
}

function optsHtml(opts, cur, answer, act){
  var L = 'ABCD';
  return '<div class="opts">' + opts.map(function(o, i){
    var cls = 'opt';
    if(cur.picked !== null){
      if(o === answer) cls += ' right';
      else if(i === cur.picked) cls += ' wrong';
      else cls += ' dim';
    }
    return '<button class="' + cls + '" data-act="' + act + '" data-i="' + i + '"' + (cur.picked !== null ? ' disabled' : '') + '><span class="l">' + L[i] + '</span><span>' + esc(o) + '</span></button>';
  }).join('') + '</div>';
}

function studyLink(e){
  var en = entry(e);
  return '<button class="study-link" data-act="entry" data-n="' + e + '">Study ' + pad(e) + ' · ' + esc(en.t) + '</button>';
}

function orderHtml(items, cur){
  var ranks = sortedRanks(items);
  var h = '<div class="ord">';
  cur.shown.forEach(function(k){
    var it = items[k], pos = cur.tap.indexOf(k), cls = 'ocard', extra = '';
    if(pos >= 0) cls += ' set';
    if(cur.checked){
      var good = it.rank === ranks[pos];
      cls += good ? ' ok' : ' no';
      extra = '<span class="ref">' + esc(it.ref) + '</span>' + (good ? '' : '<span class="should">Belongs at ' + (ranks.indexOf(it.rank) + 1) + '</span>');
    }
    h += '<button class="' + cls + '" data-act="ord" data-k="' + k + '"' + (cur.checked ? ' disabled' : '') + '><span class="on">' + (pos >= 0 ? pos + 1 : '') + '</span><span><b>' + esc(it.label) + '</b>' + extra + '</span></button>';
  });
  return h + '</div>';
}

function orderFeedback(items, cur){
  var n = items.length, ok = cur.right === n;
  var sorted = items.slice().sort(function(a, b){ return a.rank - b.rank; });
  return '<div class="fb' + (ok ? '' : ' bad') + '" tabindex="-1"><p class="v">' + (ok ? 'All in order' : cur.right + ' of ' + n + ' in place') + '</p>'
    + '<p class="ans">' + sorted.map(function(it, i){ return (i + 1) + '. ' + esc(it.label) + ' <span class="mute">(' + esc(it.ref) + ')</span>'; }).join('<br>') + '</p></div>';

    if(f === 'review' && miss.indexOf(en.n) < 0) return;
    if(en.s !== cur){ if(cur !== null) h += '</ol>'; cur = en.s; h += '<h2 class="sec">' + esc(en.s + ' · ' + D.sections[en.s]) + '</h2><ol class="slist">'; }
    h += '<li><button data-act="entry" data-n="' + en.n + '"><span class="n">' + pad(en.n) + '</span><span>' + esc(en.t) + '</span>' + (P.missed[en.n] ? '<span class="badge">' + P.missed[en.n] + '</span>' : '<span></span>') + '</button></li>';
  });
  return h + '</ol>';
}

function vEntry(){
  var en = entry(S.entryN);
  var h = playBar('Study ' + pad(en.n), en.t, '<span></span>', true);
  h += '<article class="entry"><p class="kicker">' + esc(en.s + ' · ' + D.sections[en.s]) + '</p><div class="bign">' + pad(en.n) + '</div><h1>' + esc(en.t) + '</h1>';
  if(en.a) h += '<p class="ansl">' + esc(en.a) + '</p>';
  en.blocks.forEach(function(b){
    if(b[0] === 'P') h += b[1].map(function(p){ return '<p>' + esc(p) + '</p>'; }).join('');
    else {
      var rows = b[1].map(function(r){ return r.split('|').map(function(x){ return x.trim(); }); });
      var head = rows[0];
      h += '<div class="tbl">' + rows.slice(1).map(function(r){ return '<div class="tr"><div class="trh">' + esc(r[0]) + '</div>' + r.slice(1).map(function(v, i){ return '<div><b>' + esc(head[i + 1]) + '</b> ' + esc(v) + '</div>'; }).join('') + '</div>'; }).join('') + '</div>';
    }
  });
  var f = '';
  if(en.q){ var k = en.q.split('|'); f += '<div class="f"><span class="lbl">Key text</span><span><b>' + esc(k[0].trim()) + '</b> ' + esc(k.slice(1).join('|').trim()) + '</span></div>'; }
  if(en.sc) f += '<div class="f"><span class="lbl">Scripture</span><span>' + esc(en.sc) + '</span></div>';
  if(en.w) f += '<div class="f"><span class="lbl">Westminster Standards</span>' + en.w.split(' · ').map(function(s){ return '<div class="std">' + esc(s) + '</div>'; }).join('') + '</div>';
  if(en.c) f += '<div class="f"><span class="lbl">In Christ</span><span>' + esc(en.c) + '</span></div>';
  if(en.r) f += '<div class="f"><span class="lbl">Source</span><span>' + esc(en.r) + '</span></div>';
  h += '<div class="fields">' + f + '</div></article>';
  h += '<div class="dock"><div class="dock-in"><button class="btn ghost" data-act="entry" data-n="' + (en.n - 1) + '"' + (en.n > 1 ? '' : ' disabled') + '>Previous</button><button class="btn" data-act="entry" data-n="' + (en.n + 1) + '"' + (en.n < 61 ? '' : ' disabled') + '>Next</button></div></div>';
  return h;
}

function render(){
  var v = {home:vHome, play:vPlay, result:vResult, blitz:vBlitz, timeline:vTimeline, study:vStudy, entry:vEntry}[S.screen] || vHome;
  app.innerHTML = v();
}

/* ---------- events ---------- */
app.addEventListener('click', function(ev){
  var b = ev.target.closest('[data-act]'); if(!b || b.disabled) return;
  var act = b.getAttribute('data-act');
  if(act !== 'quit') S.quitArmed = false;
  switch(act){
    case 'home': stopBlitzTimer(); go('home'); break;
    case 'stage': startStage(Number(b.getAttribute('data-id'))); break;
    case 'review': startReview(); break;
    case 'blitz': startBlitz(); break;
    case 'timeline': startTimeline(); break;
    case 'study': S.studyBack = S.screen === 'result' ? 'result' : 'home'; go('study'); break;
    case 'filter': S.studyFilter = b.getAttribute('data-f'); render(); break;
    case 'entry':
      if(S.screen !== 'entry'){ S.entryBack = S.screen; S.entryRun = S.run || null; }
      S.entryN = Number(b.getAttribute('data-n')); go('entry'); break;
    case 'back':
      if(S.screen === 'entry'){ var to = S.entryBack || 'study'; go(to); }
      else go(S.studyBack || 'home');
      break;
    case 'quit':
      if(S.quitArmed){ S.quitArmed = false; stopBlitzTimer(); S.run = null; S.blitz = null; S.tl = null; go('home'); }
      else { S.quitArmed = true; render(); setTimeout(function(){ if(S.quitArmed){ S.quitArmed = false; if(S.screen === 'play' || S.screen === 'blitz' || S.screen === 'timeline') render(); } }, 3000); }
      break;
    case 'pick': pick(Number(b.getAttribute('data-i'))); break;
    case 'clue': if(S.run && S.run.cur.picked === null){ S.run.cur.revealed += 1; render(); } break;
    case 'next': nextQ(); break;
    case 'ord': tapOrder(Number(b.getAttribute('data-k')), S.screen === 'timeline' ? S.tl.cur : S.run.cur); break;
    case 'ordclear': S.run.cur.tap = []; render(); break;
    case 'ordcheck': checkOrderQ(); break;
    case 'bpick': blitzPick(Number(b.getAttribute('data-i'))); break;
    case 'tlclear': S.tl.cur.tap = []; render(); break;
    case 'tlcheck': checkTimeline(); break;
    case 'tlnext': nextRound(); break;
  }
});

render();
})();
</script>
</body></html>
