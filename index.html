<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Covenant Road"><meta name="theme-color" content="#ffffff"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body><title>Covenant Road</title>
<style>
/* Layout: one 34rem column on white. Swiss hairline grid, hard rules, no rounding. The Road is a numbered list because the stages are a real sequence. */
:root{
  --paper:#ffffff;
  --ink:#14161c;
  --blue:#526ca3;
  --blue-deep:#3d5488;
  --wash:#eef1f7;
  --mute:#596072;
  --rule:#d5d9e2;
  --bad:#c3362b;
  --bad-wash:#fbebe9;
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --s-1:.8125rem; --s0:1.0625rem; --s1:1.25rem; --s2:1.5rem; --s3:2.25rem;
  color-scheme:light;
}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--font);font-size:var(--s0);line-height:1.45;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{cursor:default}
h1,h2,h3,p,ol,ul{margin:0}
ol,ul{padding:0;list-style:none}
.wrap{max-width:34rem;margin:0 auto;padding-inline:16px;padding-block:18px 128px}
.kicker{font-size:var(--s-1);font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--blue)}
.mute{color:var(--mute)}
.tab{font-variant-numeric:tabular-nums}

/* ---------- home ---------- */
.mast{display:grid;gap:10px;padding-top:6px}
.title{font-size:clamp(3.2rem,17vw,4.6rem);line-height:.9;font-weight:700;letter-spacing:-.035em;text-wrap:balance}
.title.sm{font-size:clamp(2.4rem,11vw,3.2rem)}
.slab{width:56px;height:7px;background:var(--blue)}
.lede{font-size:var(--s1);line-height:1.35;max-width:30ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--ink);margin-top:22px}
.stats>div{padding:10px 8px 12px 0;display:grid;gap:2px}
.stats>div+div{padding-left:10px;border-left:1px solid var(--rule)}
.stats b{font-size:var(--s3);line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.stats span{font-size:var(--s-1);color:var(--mute)}
.cta{display:grid;gap:4px;width:100%;background:var(--blue);color:var(--paper);padding:16px;margin-top:6px}
.cta .kicker{color:var(--paper);opacity:.85}
.cta-t{font-size:var(--s1);font-weight:700;line-height:1.2}
.modes{display:grid;grid-template-columns:1fr 1fr;margin-top:14px;border-top:1px solid var(--ink);border-left:1px solid var(--ink)}
.modes button{display:grid;align-content:start;gap:4px;padding:14px 12px 16px;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);min-height:96px}
.modes b{font-size:var(--s0)}
.modes span{font-size:var(--s-1);color:var(--mute);line-height:1.35}
.modes button:disabled b,.modes button:disabled span{color:var(--mute);opacity:.6}
.sec{font-size:var(--s-1);font-weight:700;letter-spacing:.11em;text-transform:uppercase;border-top:2px solid var(--ink);padding-top:8px;margin-top:30px}
.road li+li{border-top:1px solid var(--rule)}
.road button{display:grid;grid-template-columns:3.1rem 1fr auto;gap:10px;align-items:center;width:100%;padding:14px 0}
.road .num{font-size:1.85rem;line-height:1;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.road .rt{display:grid;gap:2px;min-width:0}
.road .rt b{font-size:var(--s0);line-height:1.2}
.road .rt span{font-size:var(--s-1);color:var(--mute)}
.road .next{color:var(--blue);font-weight:700}
.pips{display:flex;gap:4px}
.pips i{width:11px;height:11px;border:1.5px solid var(--blue)}
.pips i.on{background:var(--blue)}
.foot{margin-top:28px;border-top:1px solid var(--rule);padding-top:10px;font-size:.75rem;color:var(--mute);line-height:1.4;display:grid;gap:6px}

/* ---------- play ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:2px solid var(--ink)}
.quit{font-size:var(--s-1);font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:8px 10px 8px 0;min-height:40px}
.quit.armed{color:var(--bad)}
.bar-mid{display:grid;min-width:0}
.bar-mid b{font-size:.9375rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lamps{display:flex;gap:5px;align-items:center}
.lamps i{width:14px;height:14px;border:2px solid var(--blue)}
.lamps i.on{background:var(--blue)}
.prog{display:flex;gap:3px;margin-top:12px}
.prog i{flex:1;height:5px;background:var(--rule)}
.prog i.done{background:var(--blue)}
.prog i.miss{background:var(--bad)}
.prog i.cur{background:var(--ink)}
.scoreline{display:flex;justify-content:space-between;font-size:var(--s-1);color:var(--mute);margin-top:8px;font-variant-numeric:tabular-nums}
.scoreline b{color:var(--ink)}
.mult{color:var(--blue);font-weight:700;margin-left:6px}
.qhead{margin-top:20px;display:grid;gap:8px}
.prompt{font-size:var(--s2);line-height:1.25;font-weight:700;text-wrap:balance;letter-spacing:-.01em}
.prompt.quote{font-weight:400;font-size:var(--s1);line-height:1.45;letter-spacing:0}
.prompt.big{font-size:var(--s3);letter-spacing:-.02em}
.blank{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--blue);line-height:1.1}
.filled{font-weight:700;color:var(--blue);border-bottom:3px solid var(--blue)}
.filled.bad{color:var(--bad);border-color:var(--bad)}
.clues{counter-reset:c;margin-top:4px;border-top:1px solid var(--rule)}
.clues li{counter-increment:c;display:grid;grid-template-columns:1.6rem 1fr;padding:9px 0;border-bottom:1px solid var(--rule);font-size:var(--s0)}
.clues li::before{content:counter(c);font-weight:700;color:var(--blue)}
.more{margin-top:10px;font-size:var(--s-1);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);padding:8px 0;min-height:40px}
.opts{display:grid;gap:8px;margin-top:18px}
.opt{display:grid;grid-template-columns:1.4rem 1fr;gap:10px;align-items:start;width:100%;min-height:56px;padding:14px;border:1.5px solid var(--ink);background:var(--paper);transition:background-color .12s,color .12s,border-color .12s}
.opt .l{font-weight:700;color:var(--blue)}
.opt.right{background:var(--blue);border-color:var(--blue);color:var(--paper)}
.opt.right .l,.opt.wrong .l{color:var(--paper)}
.opt.wrong{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.opt.dim{opacity:.4}
.fb{margin-top:18px;border-top:3px solid var(--blue);padding-top:10px;display:grid;gap:6px}
.fb.bad{border-top-color:var(--bad)}
.fb .v{font-weight:700;font-size:var(--s1)}
.fb.bad .v{color:var(--bad)}
.fb:not(.bad) .v{color:var(--blue)}
.fb .ans b{font-weight:700}
.esv{display:grid;gap:10px;margin-top:6px}
.esv blockquote{margin:0;padding-left:12px;border-left:3px solid var(--blue);font-size:.98rem;line-height:1.5}
.esv blockquote b{color:var(--blue);margin-right:4px}
.study-link{justify-self:start;font-size:var(--s-1);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);padding:8px 0;min-height:40px;text-decoration:underline;text-underline-offset:3px}
.ord{display:grid;gap:8px;margin-top:18px}
.ocard{display:grid;grid-template-columns:2.4rem 1fr;gap:8px;align-items:center;width:100%;min-height:58px;padding:12px 14px;border:1.5px solid var(--ink);background:var(--paper)}
.ocard .on{font-size:var(--s1);font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.ocard.set{background:var(--wash)}
.ocard.ok{border-color:var(--blue);background:var(--wash)}
.ocard.no{border-color:var(--bad);background:var(--bad-wash)}
.ocard .ref{display:block;font-size:var(--s-1);color:var(--mute);margin-top:2px}
.ocard .should{display:block;font-size:var(--s-1);color:var(--bad);font-weight:700;margin-top:2px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:2px solid var(--ink);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:32rem;margin:0 auto;display:flex;gap:8px}
.btn{flex:1;min-height:54px;background:var(--ink);color:var(--paper);font-weight:700;text-align:center;font-size:var(--s0);padding:0 12px}
.btn.blue{background:var(--blue)}
.btn.ghost{background:var(--paper);color:var(--ink);border:1.5px solid var(--ink)}
.btn:disabled{opacity:.3}

/* ---------- results ---------- */
.res{display:grid;gap:12px;padding-top:14px}
.verdict-line{font-size:var(--s1);line-height:1.35}
.misslist li+li{border-top:1px solid var(--rule)}
.misslist button{display:grid;grid-template-columns:2.4rem 1fr auto;gap:8px;align-items:center;width:100%;padding:12px 0}
.misslist .n{font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.misslist .go{font-size:var(--s-1);color:var(--mute)}
.textbtn{justify-self:start;margin-top:18px;font-size:var(--s-1);font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:10px 0;min-height:44px}

/* ---------- blitz ---------- */
.timer{height:8px;background:var(--rule);margin-top:12px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--blue);transform-origin:left center}
.bcount{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px}
.bcount b{font-size:var(--s3);line-height:1;font-variant-numeric:tabular-nums}
.flash{margin-top:14px;font-weight:700;min-height:1.5em}
.flash.bad{color:var(--bad)}
.flash.ok{color:var(--blue)}

/* ---------- study ---------- */
.tabs{display:grid;grid-template-columns:1fr 1fr;margin-top:14px;border:1.5px solid var(--ink)}
.tabs button{text-align:center;padding:12px 8px;font-weight:700;min-height:48px}
.tabs button+button{border-left:1.5px solid var(--ink)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.slist li+li{border-top:1px solid var(--rule)}
.slist button{display:grid;grid-template-columns:2.4rem 1fr auto;gap:8px;align-items:center;width:100%;padding:12px 0;min-height:52px}
.slist .n{font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.badge{font-size:.75rem;font-weight:700;color:var(--paper);background:var(--bad);padding:2px 7px}
.empty{margin-top:18px;color:var(--mute)}
.entry{display:grid;gap:12px;padding-top:16px}
.entry .bign{font-size:3rem;line-height:.9;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.entry h1{font-size:var(--s2);line-height:1.2;text-wrap:balance}
.entry .ansl{font-size:var(--s1);font-weight:700}
.entry p{max-width:65ch}
.fields{border-top:2px solid var(--ink);margin-top:6px}
.f{padding:10px 0;border-bottom:1px solid var(--rule);display:grid;gap:3px;font-size:.98rem}
.f:last-child{border-bottom:0}
.f .lbl{font-size:.75rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--blue)}
.std+.std{margin-top:5px}
.tbl{border-top:1px solid var(--ink)}
.tr{padding:9px 0;border-bottom:1px solid var(--rule);font-size:.98rem}
.trh{font-weight:700;color:var(--blue)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(function(){
'use strict';
var D = {"stages":[{"id":1,"title":"Eden and the Fall","span":"Gen 1–3","from":1,"to":6},{"id":2,"title":"Flood to Babel","span":"Gen 6–11","from":7,"to":9},{"id":3,"title":"The Patriarchs","span":"Gen 12–50","from":10,"to":16},{"id":4,"title":"Out of Egypt","span":"Exod 3–16","from":17,"to":21},{"id":5,"title":"Sinai and the Wilderness","span":"Exodus to Deuteronomy","from":22,"to":26},{"id":6,"title":"Conquest to Samuel","span":"Joshua to 1 Samuel 3","from":27,"to":31},{"id":7,"title":"The Kingdom","span":"1 Samuel 8 to 1 Kings 22","from":32,"to":36},{"id":8,"title":"Kings, Exile, Return","span":"2 Kings to Nehemiah","from":37,"to":44},{"id":9,"title":"The Prophets","span":"Isaiah to Malachi","from":45,"to":56},{"id":10,"title":"Wisdom","span":"Job to Song of Solomon","from":57,"to":61}],"sections":{"I":"OT Narrative Survey","II":"OT Prophets","III":"Wisdom Literature"},"entries":[{"n":1,"s":"I","t":"Creation","blocks":[["P",["God (Father, Son, and Holy Spirit) made all things out of nothing by his word, in six days, and all very good. Creation fixes the Creator–creature distinction. God is self-sufficient and needs nothing from the world, while every creature owes him worship and obedience. It also grounds the goodness of the material world, human dignity, and God’s ownership of all things. The PCA’s Creation Study Committee (2000) set out four views of the days held in the PCA (calendar-day, day-age, framework, analogical) and could not reach unanimity on their nature and duration."]]],"q":"Gen 1:1 | In the beginning, God created the heavens and the earth.","sc":"Gen 1–2; Ps 33:6, 9; Isa 40:26; John 1:1–3; Col 1:16–17; Heb 11:3; Rev 4:11","w":"WCF 4.1 “to create or make of nothing the world, and all things therein, whether visible or invisible, in the space of six days, and all very good” · WSC 9 “God’s making all things of nothing, by the word of his power” · WLC 15","c":"The Son is the agent of creation (John 1:3; Col 1:16) and the one in whom all things hold together (Col 1:17). The new creation in Christ answers the first (2 Cor 5:17).","r":"PCA Creation Study Committee report to the 28th General Assembly (2000), summarized at https://byfaithonline.com/what-does-six-days-mean/"},{"n":2,"s":"I","t":"Image of God","blocks":[["P",["Man alone was made in God’s image, male and female (Gen 1:26–27). The Standards locate the image chiefly in knowledge, righteousness, and holiness, with dominion over the creatures as its outworking. The image makes man a rational, moral, and religious creature, able to know God and to represent his rule on earth. The fall defaced the image but did not erase it, which is why murder and cursing remain assaults on God’s image (Gen 9:6; Jas 3:9). Redemption renews it."]]],"q":"Gen 1:27 | So God created man in his own image, in the image of God he created him; male and female he created them.","sc":"Gen 1:26–28; 5:1–3; 9:6; Ps 8:5–8; Eph 4:24; Col 3:10; Jas 3:9","w":"WSC 10 “God created man male and female, after his own image, in knowledge, righteousness, and holiness, with dominion over the creatures” · WCF 4.2 “endued with knowledge, righteousness, and true holiness, after his own image” · WLC 17 · WSC 35 “renewed in the whole man after the image of God”","c":"Christ is “the image of the invisible God” (Col 1:15). Believers are being conformed to his image (Rom 8:29; 2 Cor 3:18)."},{"n":3,"s":"I","t":"Adamic Covenant","blocks":[["P",["Before the fall God bound himself to Adam in a covenant of works, which the catechisms call a “covenant of life.” Adam stood as a public person for all his posterity. Life was promised on condition of perfect, personal, and perpetual obedience, tested by the command not to eat of the tree of the knowledge of good and evil, with death as the penalty. The tree of life was the pledge of the promised life. Adam broke the covenant, and all mankind fell in him. After the fall God announced the covenant of grace in the promise of Gen 3:15."]]],"q":"Gen 2:16–17 | You may surely eat of every tree of the garden, but of the tree of the knowledge of good and evil you shall not eat, for in the day that you eat of it you shall surely die.","sc":"Gen 2:15–17; Hos 6:7; Rom 5:12–21; 10:5; 1 Cor 15:22, 45; Gal 3:10–12","w":"WCF 7.2 “The first covenant made with man was a covenant of works” · WLC 20 “upon condition of personal, perfect, and perpetual obedience, of which the tree of life was a pledge” · WSC 12 · WLC 22 “made with Adam as a public person, not for himself only, but for his posterity” · WCF 19.1","c":"Christ, the last Adam, kept the covenant Adam broke and bore its curse (Rom 5:18–19; 1 Cor 15:45). His obedience is the ground of the believer’s justification (WCF 11.1; WLC 70)."},{"n":4,"s":"I","t":"Cultural Mandate","blocks":[["P",["The cultural mandate is God’s charge to be fruitful, fill the earth, subdue it, and exercise dominion (Gen 1:28), working and keeping the garden (Gen 2:15). With it come marriage, family, and labor as creation ordinances, alongside the Sabbath, all given before the fall. Work is vocation under God, and dominion is stewardship of what belongs to him, not ownership. The mandate is restated to Noah after the flood (Gen 9:1–7), now carried out under the curse on the ground (Gen 3:17–19)."]]],"q":"Gen 1:28 | And God blessed them. And God said to them, “Be fruitful and multiply and fill the earth and subdue it, and have dominion over the fish of the sea and over the birds of the heavens and over every living thing that moves on the earth.”","sc":"Gen 1:26–28; 2:15, 18–24; 9:1–7; Ps 8:5–8; Heb 2:5–9","w":"WLC 20 “placing him in paradise, appointing him to dress it ... putting the creatures under his dominion, and ordaining marriage for his help ... instituting the sabbath” · WCF 4.2 “had dominion over the creatures” · WSC 10","c":"Hebrews 2:5–9 applies Psalm 8 to Jesus. The dominion Adam forfeited is fulfilled in the crowned Son of Man, and his people share his reign (2 Tim 2:12; Rev 5:10)."},{"n":5,"s":"I","t":"Fall","blocks":[["P",["Tempted by Satan through the serpent, Eve and then Adam ate the forbidden fruit and fell from original righteousness and communion with God. Because Adam was the covenant head, the guilt of his first sin is imputed to all his posterity, and a corrupted nature passes to all who descend from him by ordinary generation. Mankind is now in an estate of sin and misery: guilty, corrupt in every faculty, under God’s wrath and curse, and liable to death and hell. Every actual transgression flows from this original corruption."]]],"q":"Rom 5:12 | Therefore, just as sin came into the world through one man, and death through sin, and so death spread to all men because all sinned—","sc":"Gen 3:1–24; Eccl 7:29; Rom 3:10–23; 5:12–19; 1 Cor 15:21–22; Eph 2:1–3","w":"WSC 13 “Our first parents, being left to the freedom of their own will, fell from the estate wherein they were created, by sinning against God” · WSC 17 “The fall brought mankind into an estate of sin and misery” · WSC 18–19 · WCF 6.3 “the guilt of this sin was imputed, and the same death in sin and corrupted nature conveyed to all their posterity” · WLC 25 “commonly called original sin”","c":"The fall sets the problem the rest of the Bible answers. “For as in Adam all die, so also in Christ shall all be made alive” (1 Cor 15:22)."},{"n":6,"s":"I","t":"Genesis 3:15","blocks":[["P",["God’s curse on the serpent contains the first gospel promise, often called the protoevangelium. God himself puts enmity between the serpent’s offspring and the woman’s, so the human race is not left in league with Satan. The conflict runs through redemptive history (Cain and Abel, Israel and the nations) and climaxes in one Offspring who crushes the serpent’s head while suffering a bruised heel. The Confession cites this verse among the proofs of the covenant of grace (WCF 7.3)."]]],"q":"Gen 3:15 | I will put enmity between you and the woman, and between your offspring and her offspring; he shall bruise your head, and you shall bruise his heel.","sc":"Gen 3:14–15; Gal 4:4; Rom 16:20; Heb 2:14; 1 John 3:8; Rev 12:9–11","w":"WCF 8.6 “the seed of the woman which should bruise the serpent’s head” · WCF 7.3 (Gen 3:15 is among the proof texts for the covenant of grace) · WLC 32 (cites Gen 3:15 for God’s provision of a Mediator)","c":"Christ, “born of woman” (Gal 4:4), destroyed the devil through death (Heb 2:14). The bruised heel is the cross, and the crushed head is Satan’s defeat."},{"n":7,"s":"I","t":"Flood","blocks":[["P",["When human wickedness filled the earth, God judged the world by water and saved Noah, his family, and the animals in the ark (Gen 6–9). Noah “found favor in the eyes of the LORD” (Gen 6:8) and acted in faith (Heb 11:7). The flood displays God’s holy hatred of sin and his saving grace in the same act. Scripture treats it as a figure of baptism (1 Pet 3:20–21) and a warning of the final judgment (Matt 24:37–39; 2 Pet 3:5–7)."]]],"q":"Gen 6:5 | The LORD saw that the wickedness of man was great in the earth, and that every intention of the thoughts of his heart was only evil continually.","sc":"Gen 6:5–8:22; Matt 24:37–39; Heb 11:7; 1 Pet 3:18–22; 2 Pet 2:5; 3:5–7","w":"WCF 6.4 (Gen 6:5 proves man is “wholly inclined to all evil”) · WLC 25 (Gen 6:5 cited for a nature “wholly inclined to all evil, and that continually”) · WCF 33.1–2 (the last judgment)","c":"As the ark carried Noah through judgment, Christ carries his people through the wrath to come (1 Thess 1:10; 1 Pet 3:18–21)."},{"n":8,"s":"I","t":"Noahic Covenant","blocks":[["P",["After the flood God covenanted with Noah, his descendants, and every living creature never again to destroy the earth by flood, and set the rainbow as its sign (Gen 9:8–17). The covenant secures the regularity of nature (Gen 8:22) as the stage on which redemption will unfold. It renews the creation mandate (Gen 9:1, 7), permits animal food (9:3), and institutes judicial justice for murder because man bears God’s image (9:6). It is a covenant of preservation with all flesh, distinct from the saving promises yet serving them."]]],"q":"Gen 9:13 | I have set my bow in the cloud, and it shall be a sign of the covenant between me and the earth.","sc":"Gen 6:18; 8:20–9:17; Isa 54:9–10; Acts 14:17; Rom 3:25–26; 2 Pet 3:5–9","w":"WCF 5.2 (Gen 8:22 proves God orders events “according to the nature of second causes”) · WSC 69 (Gen 9:6 proves the sixth commandment forbids taking life “unjustly”) · WLC 81 (cites Isa 54:7–10 for God’s unfailing kindness to his people)","c":"God’s forbearance preserves the world until the fullness of time (Rom 3:25–26; 2 Pet 3:9). Isaiah uses the Noahic oath to guarantee God’s covenant of peace with his people (Isa 54:9–10)."},{"n":9,"s":"I","t":"The Tower of Babel","blocks":[["P",["United by one language, the post-flood peoples settled in Shinar and built a city and tower to make a name for themselves and avoid being dispersed (Gen 11:4). It was proud self-exaltation and a refusal of God’s command to fill the earth (Gen 9:1). God came down, confused their language, and scattered them (11:7–9). Babel closes the primeval history and sets up the call of Abram, to whom God promises a great name and blessing for all nations by grace (Gen 12:2–3)."]]],"q":"Gen 11:4 | Then they said, “Come, let us build ourselves a city and a tower with its top in the heavens, and let us make a name for ourselves, lest we be dispersed over the face of the whole earth.”","sc":"Gen 10:8–12; 11:1–9; 12:1–3; Acts 2:5–11; Rev 7:9–10","w":"WCF 5.1 (God governs “all creatures, actions, and things, from the greatest even to the least”) · WCF 25.2 (the visible church under the gospel is “not confined to one nation as before under the law”)","c":"At Pentecost the gospel was heard in many languages (Acts 2:6–11). In Revelation every tribe and tongue worships the Lamb (Rev 7:9)."},{"n":10,"s":"I","t":"Abrahamic Covenant","blocks":[["P",["God called Abram from Ur and promised land, offspring, a great name, and blessing to all the families of the earth through him (Gen 12:1–3). He ratified the promise in a covenant ceremony in which God alone passed between the pieces (Gen 15), confirmed it with circumcision and the pledge to be God to Abraham and his offspring (Gen 17:7), and swore by himself after Moriah (Gen 22:16–18). This is the covenant of grace in its patriarchal administration. Its promises are fulfilled in Christ, the singular Offspring (Gal 3:16), and extend to all who share Abraham’s faith, Jew and Gentile (Gal 3:7–9, 29)."]]],"q":"Gen 12:2–3 | And I will make of you a great nation, and I will bless you and make your name great, so that you will be a blessing. I will bless those who bless you, and him who dishonors you I will curse, and in you all the families of the earth shall be blessed.","sc":"Gen 12:1–3; 15:1–21; 17:1–14; 22:15–18; Rom 4:9–17; Gal 3:6–29; Heb 6:13–18","w":"WCF 7.5 “under the law it was administered by promises, prophecies, sacrifices, circumcision, the paschal lamb, and other types and ordinances” · WLC 31 “The covenant of grace was made with Christ as the second Adam, and in him with all the elect as his seed” · WCF 28.4 and WLC 166 (Gen 17:7 grounds the baptism of believers’ children)","c":"“And if you are Christ’s, then you are Abraham’s offspring, heirs according to promise” (Gal 3:29)."},{"n":11,"s":"I","t":"Melchizedek","blocks":[["P",["Melchizedek, king of Salem and “priest of God Most High,” met Abram after the rescue of Lot, brought out bread and wine, blessed him, and received a tenth of the spoils (Gen 14:17–20). He appears without recorded genealogy and unites kingship and priesthood in one person. Psalm 110:4 promises that David’s Lord will be a priest forever after his order. Hebrews 5–7 argues that this priesthood is superior to Levi’s, since Levi, still in Abraham’s loins, paid tithes to Melchizedek (Heb 7:9–10), and that it is permanent rather than passed on at death (7:23–24)."]]],"q":"Ps 110:4 | The LORD has sworn and will not change his mind, “You are a priest forever after the order of Melchizedek.”","sc":"Gen 14:17–24; Ps 110:1–4; Heb 5:5–10; 6:20–7:28","w":"WSC 23 “Christ, as our Redeemer, executeth the offices of a prophet, of a priest, and of a king” · WLC 42 (cites Heb 5:5–7 for Christ’s priesthood) · WLC 44 · WCF 8.1","c":"Christ is the true King-Priest who “always lives to make intercession” for those who draw near to God through him (Heb 7:25)."},{"n":12,"s":"I","t":"Genesis 15:6","blocks":[["P",["When God promised offspring as numerous as the stars, childless Abram believed him, and God counted that faith as righteousness. Abram was declared righteous before circumcision and before the law, by trusting God’s promise. Paul uses the verse as his chief Old Testament proof of justification by faith apart from works (Rom 4; Gal 3:6). James cites it to show that true justifying faith proves itself in obedience (Jas 2:21–23). The Standards guard the point: faith is the instrument that receives Christ’s righteousness, not itself the righteousness that justifies."]]],"q":"Gen 15:6 | And he believed the LORD, and he counted it to him as righteousness.","sc":"Gen 15:1–6; Rom 4:1–25; Gal 3:6–9; Jas 2:21–24; Heb 11:8–12","w":"WCF 11.1 “nor by imputing faith itself, the act of believing, or any other evangelical obedience to them, as their righteousness; but by imputing the obedience and satisfaction of Christ unto them” · WLC 73 “only as it is an instrument by which he receiveth and applieth Christ and his righteousness” · WCF 11.6 “one and the same with the justification of believers under the New Testament” · WSC 33","c":"Abraham was justified the same way believers are now, by faith in God’s promise fulfilled in Christ (Rom 4:23–25)."},{"n":13,"s":"I","t":"Genesis 17: Circumcision","blocks":[["P",["When Abram was ninety-nine, God renamed him Abraham, “father of a multitude,” and Sarai Sarah, restated his everlasting covenant, and gave circumcision as its sign. Every male in the household, infants on the eighth day and servants included, was to receive it. The uncircumcised male was cut off as a covenant breaker (Gen 17:14). Circumcision signified the cutting away of sin, called for a circumcised heart (Deut 10:16; 30:6), and was “a seal of the righteousness that he had by faith” (Rom 4:11). In the new covenant, baptism takes its place as the sign and seal of the same covenant of grace (Col 2:11–12)."]]],"q":"Gen 17:7 | And I will establish my covenant between me and you and your offspring after you throughout their generations for an everlasting covenant, to be God to you and to your offspring after you.","sc":"Gen 17:1–27; Deut 10:16; 30:6; Jer 4:4; Rom 2:28–29; 4:9–12; Col 2:11–12","w":"WCF 27.1 “Sacraments are holy signs and seals of the covenant of grace” (proofs include Gen 17:7, 10 and Rom 4:11) · WCF 27.5 “for substance, the same with those of the New” · WCF 28.4 “the infants of one or both believing parents are to be baptized” · WSC 95 (proof: Gen 17:10 with Col 2:11–12)","c":"Christ was circumcised under the law (Luke 2:21). Believers in him receive “the circumcision of Christ,” made without hands (Col 2:11)."},{"n":14,"s":"I","t":"Genesis 22: “Sacrifice” of Isaac","blocks":[["P",["God tested Abraham by commanding him to offer Isaac, the son of promise, on a mountain in the land of Moriah. Abraham obeyed, trusting that God would provide and, as Hebrews says, that God was able to raise the dead (Heb 11:17–19). The angel of the LORD stopped him at the last moment, and God provided a ram as a substitute. Abraham named the place “The LORD will provide” (Gen 22:14). The quotation marks in the title matter, since Isaac was not slain. Moriah is later the site of Solomon’s temple (2 Chr 3:1)."]]],"q":"Gen 22:8 | Abraham said, “God will provide for himself the lamb for a burnt offering, my son.”","sc":"Gen 22:1–19; 2 Chr 3:1; John 1:29; Rom 8:32; Heb 11:17–19; Jas 2:21–23","w":"WCF 11.2 (justifying faith “is no dead faith, but worketh by love,” proved from Jas 2:17, 22, 26) · WCF 14.2 “yielding obedience to the commands” · WLC 71 “did provide this surety, his own only Son”","c":"What God spared Abraham, he did not spare himself. “He who did not spare his own Son but gave him up for us all” (Rom 8:32) is the Lamb God provided (John 1:29)."},{"n":15,"s":"I","t":"Jacob & Esau","blocks":[["P",["Rebekah’s twins struggled in the womb, and God announced before their birth that the older would serve the younger (Gen 25:23). Esau despised his birthright and sold it for a meal (25:29–34). Jacob took the blessing by deceit with Rebekah’s help (Gen 27), fled to Haran, met God at Bethel (28:10–22), wrestled with God at Peniel and was renamed Israel (32:22–32), and was later reconciled to Esau (Gen 33). Their nations, Israel and Edom, carried the rivalry forward (Obadiah). Paul uses the twins to show that election rests on God’s free purpose, not on works or birth order."]]],"q":"Rom 9:11–13 | though they were not yet born and had done nothing either good or bad—in order that God’s purpose of election might continue, not because of works but because of him who calls—she was told, “The older will serve the younger.” As it is written, “Jacob I loved, but Esau I hated.”","sc":"Gen 25:19–34; 27–28; 32–33; Mal 1:2–3; Rom 9:10–13; Heb 12:16–17","w":"WCF 3.5 “out of his mere free grace and love, without any foresight of faith or good works ... as conditions, or causes moving him thereunto” (proofs include Rom 9:11, 13) · WLC 67 “from nothing in them moving him thereunto” · WSC 20","c":"God keeps his promise through a flawed man. Jacob is not chosen because he is better, which is good news for every sinner the Father gives to Christ (John 6:37)."},{"n":16,"s":"I","t":"Genesis 50:20","blocks":[["P",["After Jacob’s death, Joseph’s brothers feared revenge for selling him into slavery. Joseph answered that their evil intent and God’s good intent were both at work in the same events, and God’s purpose prevailed to preserve many lives, including the line of promise. The verse is the classic text for God’s providence over sin. God ordains and governs even wicked acts for his holy ends, while the sinfulness belongs only to the creature. The cross is the supreme instance (Acts 2:23; 4:27–28)."]]],"q":"Gen 50:20 | As for you, you meant evil against me, but God meant it for good, to bring it about that many people should be kept alive, as they are today.","sc":"Gen 45:5–8; 50:15–21; Ps 105:16–22; Acts 2:23; 4:27–28; Rom 8:28","w":"WCF 5.4 “otherwise ordering and governing of them, in a manifold dispensation, to his own holy ends” (proof: Gen 50:20), “yet so as the sinfulness thereof proceedeth only from the creature, and not from God” · WCF 3.1 “neither is God the author of sin, nor is violence offered to the will of the creatures” · WSC 11 · WLC 18","c":"Joseph, rejected by his brothers and exalted to save them, prefigures Christ (Acts 7:9–14). God turned the worst sin in history into salvation (Acts 2:23)."},{"n":17,"s":"I","t":"The Burning Bush","blocks":[["P",["At Horeb God appeared to Moses in a flame of fire from a bush that burned but was not consumed (Exod 3:1–6). He declared the ground holy, identified himself as the God of Abraham, Isaac, and Jacob, and said he had seen his people’s affliction and come down to deliver them (3:7–8). When Moses asked his name, God answered “I AM WHO I AM” and gave the covenant name YHWH, rendered “the LORD” (3:14–15). The scene reveals God’s self-existence, holiness, and covenant faithfulness. Jesus used this passage to prove the resurrection (Mark 12:26–27)."]]],"q":"Exod 3:14 | God said to Moses, “I AM WHO I AM.” And he said, “Say this to the people of Israel: ‘I AM has sent me to you.’”","sc":"Exod 2:23–4:17; 6:2–8; Mark 12:26–27; John 8:58; Acts 7:30–35","w":"WLC 101 “JEHOVAH, the eternal, immutable, and almighty God; having his being in and of himself” · WLC 7 “in and of himself infinite in being” (proof: Exod 3:14) · WSC 4 (proof: Exod 3:14) · WCF 2.1","c":"The covenant God who came down to deliver Israel came down in the Son (John 1:14). “Before Abraham was, I am” (John 8:58)."},{"n":18,"s":"I","t":"The Plagues","blocks":[["P",["Through Moses and Aaron God struck Egypt with ten plagues: blood, frogs, gnats, flies, death of livestock, boils, hail, locusts, darkness, and the death of the firstborn (Exod 7–12). Their stated purpose was that Egypt and Israel would know that he is the LORD (Exod 7:5; 10:2). They were judgments on Egypt’s gods (Exod 12:12; Num 33:4), and from the fourth plague on, God made a distinction between Egypt and his people (8:22–23; 11:7). Pharaoh hardened his heart, and God hardened it as a judicial act, displaying his power and name in all the earth (Exod 9:16; Rom 9:17–18)."]]],"q":"Exod 12:12 | For I will pass through the land of Egypt that night, and I will strike all the firstborn in the land of Egypt, both man and beast; and on all the gods of Egypt I will execute judgments: I am the LORD.","sc":"Exod 7:1–12:32; Ps 78:43–51; 105:26–36; Rom 9:17–18; Rev 15–16","w":"WCF 5.6 (God hardens the wicked “as a righteous judge, for former sins,” and they “harden themselves,” proved from Exod 7:3 with 8:15, 32) · WLC 13 (proof: Rom 9:17–18) · WCF 5.1","c":"The plagues anticipate the last judgments of Revelation’s bowls (Rev 15–16), from which Christ delivers his people."},{"n":19,"s":"I","t":"Passover","blocks":[["P",["On the night of the tenth plague each Israelite household killed a lamb without blemish and put its blood on the doorposts and lintel. The LORD passed over the houses marked with blood and struck Egypt’s firstborn (Exod 12:1–13). Israel ate the lamb with unleavened bread and bitter herbs, dressed to leave, and kept the feast as a perpetual memorial of redemption (12:14, 24–27). Passover teaches substitution: a lamb dies in place of the firstborn. Jesus instituted the Lord’s Supper at the Passover meal (Luke 22:7–20)."]]],"q":"1 Cor 5:7 | For Christ, our Passover lamb, has been sacrificed.","sc":"Exod 12:1–51; Deut 16:1–8; Luke 22:7–20; John 1:29; 19:36; 1 Cor 5:7–8; 1 Pet 1:18–19","w":"WCF 7.5 “the paschal lamb” (among the types “all fore-signifying Christ to come”) · WLC 34 “the passover” (proof: 1 Cor 5:7) · WSC 92 (proof: Exod 12) · WCF 27.5","c":"Not one of the lamb’s bones was to be broken (Exod 12:46), and John sees that fulfilled at the cross (John 19:36)."},{"n":20,"s":"I","t":"The Exodus Event","blocks":[["P",["After the tenth plague Pharaoh released Israel. God led them by the pillar of cloud and fire, opened the Red Sea for them, and drowned Pharaoh’s army when it pursued (Exod 12:31–14:31). Israel sang the Song of Moses in praise of the LORD as warrior and king (Exod 15:1–18). The exodus is the Old Testament’s defining act of redemption. God saves his people by power and through judgment, keeps his promise to Abraham (Gen 15:13–14), and claims them as his own. It became the pattern for later deliverance, including the return from exile (Isa 43:16–19)."]]],"q":"Exod 20:2 | I am the LORD your God, who brought you out of the land of Egypt, out of the house of slavery.","sc":"Exod 12:31–15:21; Deut 7:7–8; Ps 106:7–12; Isa 43:16–19; Luke 9:31; 1 Cor 10:1–4","w":"WSC 44 “because God is the Lord, and our God, and Redeemer, therefore we are bound to keep all his commandments” · WLC 101 “as he brought them out of their bondage in Egypt, so he delivereth us from our spiritual thraldom” · WCF 27.5 (proof: 1 Cor 10:1–4)","c":"At the transfiguration Moses and Elijah spoke with Jesus of his “departure” (Greek exodos), “which he was about to accomplish at Jerusalem” (Luke 9:31). The cross is the greater exodus from sin and death."},{"n":21,"s":"I","t":"Manna","blocks":[["P",["When Israel grumbled for food in the wilderness, God rained bread from heaven every morning (Exod 16). Each person gathered a daily portion, twice as much on the sixth day, and none on the Sabbath. Hoarded manna bred worms, which taught daily dependence on God. Manna fed Israel for forty years and stopped when they ate the produce of Canaan (Exod 16:35; Josh 5:12). A jar of it was kept before the testimony as a memorial (Exod 16:32–34; Heb 9:4). Moses drew the lesson that life comes from God’s word, not bread alone."]]],"q":"Deut 8:3 | And he humbled you and let you hunger and fed you with manna, which you did not know, nor did your fathers know, that he might make you know that man does not live by bread alone, but man lives by every word that comes from the mouth of the LORD.","sc":"Exod 16:1–36; Num 11:4–9; Deut 8:2–3, 16; Ps 78:23–25; John 6:30–58; 1 Cor 10:3","w":"WSC 104 “that of God’s free gift we may receive a competent portion of the good things of this life” · WLC 193 “waiting upon the providence of God from day to day in the use of lawful means” · WSC 60 (proof: Exod 16:25–28, Sabbath keeping)","c":"Jesus answered Satan with Deut 8:3 (Matt 4:4) and declared, “I am the bread of life” (John 6:35). He is the true bread from heaven that gives eternal life."},{"n":22,"s":"I","t":"The Mosaic Covenant","blocks":[["P",["At Sinai God formally constituted the redeemed nation as his people (Exod 19–24). He gave the Ten Commandments, written by his own finger on two tablets, along with ceremonial laws for worship and judicial laws for the nation, and the covenant was ratified with blood (Exod 24:3–8). Grace comes first. The law follows the exodus, so obedience is the response of the redeemed, not the means of redemption. The Standards treat Sinai as an administration of the covenant of grace “under the law,” full of types pointing to Christ. Israel’s continued blessing in the land was nevertheless bound to covenant obedience (Lev 26; Deut 28)."]]],"q":"Exod 19:5–6 | Now therefore, if you will indeed obey my voice and keep my covenant, you shall be my treasured possession among all peoples, for all the earth is mine; and you shall be to me a kingdom of priests and a holy nation.","sc":"Exod 19–24; 34:1–28; Deut 5; Gal 3:17–24; Heb 8:6–13","w":"WCF 19.2 “delivered by God upon mount Sinai in ten commandments, and written in two tables” · WCF 19.3 (ceremonial laws “now abrogated under the New Testament”) · WCF 19.4 (judicial laws “expired together with the State of that people”) · WCF 7.5 · WLC 98 · WCF 19.6","c":"The law was “our guardian until Christ came” (Gal 3:24). Christ fulfilled it (Matt 5:17), mediates a better covenant (Heb 8:6), and writes the law on his people’s hearts (Jer 31:33)."},{"n":23,"s":"I","t":"The Tabernacle","blocks":[["P",["The tabernacle was the portable sanctuary God commanded at Sinai so that he might dwell among his people (Exod 25:8), built exactly to the pattern shown to Moses (25:9, 40). The courtyard held the bronze altar and basin. The Holy Place held the lampstand, the table for the bread of the Presence, and the altar of incense. The Most Holy Place held the ark of the covenant with its mercy seat. When it was finished, the glory cloud filled it (Exod 40:34–35). Its graded holiness taught both God’s nearness and the barrier of sin, with access only through sacrifice and priestly mediation."]]],"q":"Exod 25:8 | And let them make me a sanctuary, that I may dwell in their midst.","sc":"Exod 25–31; 35–40; John 1:14; Heb 8:1–5; 9:1–14, 23–24; Rev 21:3","w":"WCF 19.3 (ceremonial laws held “typical ordinances, partly of worship, prefiguring Christ, his graces, actions, sufferings, and benefits,” proof: Heb 9) · WCF 7.5 “other types and ordinances” · WLC 55 “by his appearing in our nature continually before the Father in heaven” (proof: Heb 9:12, 24)","c":"The Word “became flesh and dwelt among us” (John 1:14), literally “tabernacled.” Christ is the true meeting place of God and man, and the church is now God’s dwelling by the Spirit (Eph 2:21–22)."},{"n":24,"s":"I","t":"The Day of Atonement","blocks":[["P",["Once a year, on the tenth day of the seventh month, the high priest alone entered the Most Holy Place with blood (Lev 16). He first offered a bull for his own sin, then sprinkled the blood of a goat on and before the mercy seat for the people, cleansing the sanctuary. He then laid both hands on a second goat, confessed Israel’s sins over it, and sent it away into the wilderness. The two goats picture atonement by substitutionary death and the removal of sin. The day was a solemn Sabbath of humbling the soul (16:29–31). Its yearly repetition showed that animal blood could not finally take away sin (Heb 10:1–4)."]]],"q":"Lev 16:30 | For on this day shall atonement be made for you to cleanse you. You shall be clean before the LORD from all your sins.","sc":"Lev 16:1–34; 23:26–32; Isa 53:4–6; Heb 9:6–14, 24–28; 10:1–14","w":"WSC 25 “in his once offering up of himself a sacrifice to satisfy divine justice and reconcile us to God, and in making continual intercession for us” · WLC 44 · WCF 8.5 “hath fully satisfied the justice of his Father” · WCF 29.2 “that one offering up of himself, by himself, upon the cross, once for all”","c":"Christ our high priest “entered once for all into the holy places ... by means of his own blood, thus securing an eternal redemption” (Heb 9:12). He is both the sacrifice and the one who bears our sins away (Isa 53:6; John 1:29)."},{"n":25,"s":"I","t":"Deuteronomy 27–28","blocks":[["P",["Before Israel entered Canaan, Moses commanded a covenant ceremony at Shechem, with half the tribes on Mount Gerizim for blessing and half on Mount Ebal for curse, and the law written on plastered stones (Deut 27, carried out in Josh 8:30–35). Eleven curses on specific covenant violations end with a twelfth on all who do not keep the law (27:26). Chapter 28 sets out the covenant sanctions: blessing in city and field for obedience (28:1–14) and escalating curses for disobedience (28:15–68), climaxing in siege and exile among the nations (28:36, 52–57, 64). These chapters frame the rest of Israel’s history. The fall of Samaria and of Jerusalem is the curse of Deut 28 carried out (2 Kgs 17:7–23; Dan 9:11)."]]],"q":"Deut 27:26 | “‘Cursed be anyone who does not confirm the words of this law by doing them.’ And all the people shall say, ‘Amen.’","sc":"Deut 11:26–32; 27–28; Josh 8:30–35; 2 Kgs 17:7–23; Dan 9:11–14; Gal 3:10–14","w":"WSC 84 “Every sin deserveth God’s wrath and curse, both in this life, and that which is to come” (proof: Gal 3:10) · WLC 28 (outward punishments of sin, proof: Deut 28:15–18) · WCF 19.6 (the law’s threatenings “show what even their sins deserve,” though believers are “freed from the curse thereof”)","c":"Paul quotes Deut 27:26 to show that all who rely on the works of the law are under a curse, then gives the answer: “Christ redeemed us from the curse of the law by becoming a curse for us” (Gal 3:10, 13)."},{"n":26,"s":"I","t":"Wandering in the Wilderness","blocks":[["P",["At Kadesh the spies’ report terrified the people, and Israel refused to enter the land despite Joshua’s and Caleb’s appeal to trust God (Num 13–14). God sentenced that generation to wander forty years, a year for each day of spying, until the adults twenty years old and upward who grumbled had died, except Joshua and Caleb (Num 14:29–34). The years brought Korah’s rebellion (Num 16), Moses’ sin at Meribah that barred him from Canaan (Num 20:10–12), the bronze serpent (Num 21:4–9), and Balaam’s failed curse (Num 22–24). God’s faithfulness persisted through daily manna, water from the rock, and clothes that did not wear out (Deut 8:2–4, 15)."]]],"q":"1 Cor 10:11 | Now these things happened to them as an example, but they were written down for our instruction, on whom the end of the ages has come.","sc":"Num 13–14; 16; 20–24; Deut 1:19–46; 8:2–4; Ps 95:7–11; John 3:14–15; 1 Cor 10:1–13; Heb 3:7–4:11","w":"WCF 5.5 (God leaves his children “to manifold temptations” so “that they be humbled”) · WCF 17.3 (believers’ sins “bring temporal judgments upon themselves”) · WLC 151 (sins aggravated “against means, mercies, judgments”)","c":"Hebrews warns that unbelief kept Israel from God’s rest and urges believers to hold fast (Heb 3:12–19). Jesus compares his lifting up on the cross to the bronze serpent (John 3:14–15)."},{"n":27,"s":"I","t":"The Conquest of the Promised Land","blocks":[["P",["Under Joshua, Israel crossed the Jordan on dry ground (Josh 3–4), took Jericho by God’s power (Josh 6), was defeated at Ai until Achan’s sin was purged (Josh 7–8), and broke the southern and northern coalitions (Josh 10–11). The land was then allotted to the tribes (Josh 13–21). The conquest fulfilled God’s land promise to Abraham (Gen 15:18–21) and executed his judgment on Canaanite iniquity, which he had patiently delayed (Gen 15:16; Deut 9:4–5). It was a unique, commanded act tied to Israel’s theocratic calling, not a pattern for the church, whose warfare is spiritual (2 Cor 10:3–5). The conquest remained incomplete (Judg 1), and Joshua charged Israel to choose whom they would serve (Josh 24:15)."]]],"q":"Josh 21:45 | Not one word of all the good promises that the LORD had made to the house of Israel had failed; all came to pass.","sc":"Gen 15:16–21; Deut 7:1–6; 9:4–5; Josh 1–24; Heb 4:8–10; 11:30–31","w":"WCF 5.1 (providence works “to the praise of the glory of his wisdom, power, justice, goodness, and mercy”) · WCF 19.4 (Israel’s judicial laws “expired together with the State of that people”) · WSC 26 (Christ is king “in restraining and conquering all his and our enemies”)","c":"Joshua and Jesus bear the same name (“the LORD saves”). Joshua gave Israel a land but not the final rest (Heb 4:8). Christ, the greater Joshua, brings his people into God’s Sabbath rest (Heb 4:9–10)."},{"n":28,"s":"I","t":"The Elements of the Repeated “Cycle” or “Downward Spiral” in the Book of Judges","blocks":[["P",["Judges 2:11–19 states the pattern the book then repeats. (1) Sin: Israel “did what was evil in the sight of the LORD,” chiefly idolatry. (2) Servitude: God in anger gave them into the hand of oppressors. (3) Supplication: Israel cried out to the LORD. (4) Salvation: God raised up a judge who delivered them. (5) Silence, or rest: the land had rest while the judge lived. When the judge died, they returned to worse corruption than their fathers (2:19). That is why the cycle is a downward spiral. The judges grow more compromised (Gideon’s ephod, Jephthah’s vow, Samson’s lusts), the cry to God fades (none is recorded under Samson), and the book ends in idolatry (Judg 17–18), moral horror, and civil war (Judg 19–21)."]]],"q":"Judg 2:19 | But whenever the judge died, they turned back and were more corrupt than their fathers, going after other gods, serving them and bowing down to them.","sc":"Judg 2:6–3:11; 3:7–9; 6:1–6; 10:6–16; 13:1; Ps 106:34–46","w":"WCF 6.4 “utterly indisposed, disabled, and made opposite to all good, and wholly inclined to all evil” · WCF 5.6 (God gives the hardened “over to their own lusts,” proofs include Ps 81:11–12) · WSC 82 “No mere man since the fall is able in this life perfectly to keep the commandments of God”","c":"Each judge saved partially and temporarily. Israel needed a deliverer who would not die and leave them, a King able “to save to the uttermost” (Heb 7:25)."},{"n":29,"s":"I","t":"Judges 21:25","blocks":[["P",["The book’s last verse repeats 17:6 and the refrain “there was no king in Israel” (18:1; 19:1). It diagnoses the chaos of chapters 17–21. Without godly rule, Israel lived by moral autonomy, each man his own law, which Moses had forbidden (Deut 12:8). The verse looks ahead to the monarchy and the law of the king (Deut 17:14–20). Saul then shows that a king alone is not the cure. Israel needed a king after God’s own heart who would lead the people in God’s ways."]]],"q":"Judg 21:25 | In those days there was no king in Israel. Everyone did what was right in his own eyes.","sc":"Deut 12:8; 17:14–20; Judg 17:6; 18:1; 19:1; 1 Sam 8:4–7; Prov 12:15; Isa 9:6–7","w":"WLC 45 (Christ as king calls a people to himself, “giving them officers, laws, and censures, by which he visibly governs them”) · WSC 26 · WCF 20.3 (those who use liberty to “practice any sin” thereby “destroy the end of Christian liberty”)","c":"The cure for every man doing what is right in his own eyes is the reign of Christ, who rules his church by his Word and through the officers he gives (Eph 4:11–12)."},{"n":30,"s":"I","t":"Kinsman Redeemer (as found in the book of Ruth)","blocks":[["P",["In the days of the judges, Naomi returned from Moab widowed and childless, with her Moabite daughter-in-law Ruth, who had pledged herself to Naomi’s God (Ruth 1:16–17). Boaz, a relative of Naomi’s husband Elimelech, was a go’el, a kinsman-redeemer. The law allowed such a relative to buy back family land (Lev 25:25) and to raise up a name for the dead (compare levirate marriage, Deut 25:5–10). A nearer kinsman declined, so Boaz redeemed the land and married Ruth publicly at the city gate (Ruth 4:1–10). Their son Obed was David’s grandfather (4:17–22). The book shows God’s hidden providence filling an empty family and bringing a Gentile into the royal line (Matt 1:5)."]]],"q":"Ruth 4:14 | Then the women said to Naomi, “Blessed be the LORD, who has not left you this day without a redeemer, and may his name be renowned in Israel!","sc":"Lev 25:23–28, 47–49; Deut 25:5–10; Ruth 1–4; Matt 1:5; Heb 2:14–17; 1 Pet 1:18–19","w":"WLC 39 (the Mediator had to be man “that he might advance our nature” and “that we might receive the adoption of sons”) · WSC 22 “by taking to himself a true body and a reasonable soul” · WLC 71 “did provide this surety, his own only Son”","c":"A redeemer had to be a kinsman, able to pay, and willing. Christ became our kinsman in the flesh (Heb 2:14–17), paid “with the precious blood of Christ” (1 Pet 1:19), and laid down his life of his own accord (John 10:18)."},{"n":31,"s":"I","t":"The Call of Samuel","blocks":[["P",["Samuel, born in answer to Hannah’s prayer and dedicated to the LORD, served as a boy under the priest Eli at Shiloh when “the word of the LORD was rare in those days” (1 Sam 3:1). The LORD called him by name three times, and when the call came again Samuel answered as Eli had instructed. God’s first message through him was judgment on Eli’s house, because Eli’s sons were blaspheming God and Eli “did not restrain them” (3:13). The LORD was with Samuel and let none of his words fall to the ground, and all Israel recognized him as a prophet (3:19–20). Samuel was the last judge and the prophet who anointed Israel’s first two kings."]]],"q":"1 Sam 3:10 | And the LORD came and stood, calling as at other times, “Samuel! Samuel!” And Samuel said, “Speak, for your servant hears.”","sc":"1 Sam 1:1–4:1; 2:12–36; 7:15–17; Ps 99:6; Acts 3:24; 13:20","w":"WSC 56 (proofs include 1 Sam 2:12, 17, 22, 29 and 3:13: breakers of the third commandment may escape men’s punishment but not God’s judgment) · WLC 130 (among the sins of superiors, “remiss behaviour”) · WCF 1.1 (God revealed himself “at sundry times, and in divers manners”)","c":"Samuel’s call restored the prophetic word in a dark time, and God has now spoken finally in his Son (Heb 1:1–2). Eli’s failure is a warning to every officer, who must manage his own household well (1 Tim 3:4–5, 12)."},{"n":32,"s":"I","t":"The United Kingdom","blocks":[["P",["The united kingdom is the period when all twelve tribes were ruled by one king: Saul, David, and Solomon (c. 1050–930 BC). Israel demanded a king “like all the nations,” which God called a rejection of himself as king (1 Sam 8:5–7), yet he granted it. Saul was rejected for disobedience (1 Sam 13:13–14; 15:22–23). David, a man after God’s own heart, united the tribes, made Jerusalem the capital, brought up the ark, received the covenant of 2 Samuel 7, and fell grievously with Bathsheba before repenting (2 Sam 11–12; Ps 51). Solomon built the temple and was famed for wisdom, but his foreign wives turned his heart to other gods (1 Kgs 11:1–13), and the kingdom was divided after his death."]]],"q":"1 Sam 15:22 | And Samuel said, “Has the LORD as great delight in burnt offerings and sacrifices, as in obeying the voice of the LORD? Behold, to obey is better than sacrifice, and to listen than the fat of rams.","sc":"1 Sam 8–31; 2 Sam 1–24; 1 Kgs 1–11; 1 Chr 10–29; 2 Chr 1–9; Acts 13:21–23","w":"WSC 39 (proof: 1 Sam 15:22) · WCF 16.1 (good works are only those God commands, not those “devised by men out of blind zeal,” proof: 1 Sam 15:21–23) · WCF 17.3 (believers may “fall into grievous sins,” proofs include 2 Sam 11:27 and Ps 51) · WCF 24.3 (proof: 1 Kgs 11:4)","c":"Each king anticipates and falls short of the King to come. Christ is the true Son of David, perfectly obedient, and “something greater than Solomon” (Matt 12:42)."},{"n":33,"s":"I","t":"Davidic Covenant","blocks":[["P",["When David proposed to build God a house, God promised instead to build David a house, a dynasty (2 Sam 7:1–17). David’s offspring would build a house for God’s name, and God would establish the throne of his kingdom forever. God would be a father to him, and he would be a son to God. Sin in David’s line would be disciplined, but God’s steadfast love would not be taken away as it was from Saul. The promise narrows the line of the woman’s offspring and of Abraham’s to David’s house. Psalms 89 and 132 rehearse it, and the prophets build their hope of a coming King on it (Isa 9:6–7; 11:1–10; Jer 23:5–6)."]]],"q":"2 Sam 7:16 | And your house and your kingdom shall be made sure forever before me. Your throne shall be established forever.","sc":"2 Sam 7:1–29; 23:5; 1 Chr 17; Ps 2; 89:3–4, 28–37; 132:11–12; Luke 1:32–33; Acts 2:29–36; Rom 1:3–4","w":"WCF 8.1 (Christ ordained Prophet, Priest, and King, proofs include Ps 2:6 and Luke 1:33) · WSC 26 · WLC 45 · WLC 79 (cites 2 Sam 23:5 for God’s everlasting covenant)","c":"Jesus is the Son of David whose kingdom will have no end (Luke 1:32–33). Hebrews applies 2 Sam 7:14, “I will be to him a father, and he shall be to me a son,” to Christ (Heb 1:5)."},{"n":34,"s":"I","t":"The Temple","blocks":[["P",["David planned the temple and gathered materials (1 Chr 22; 28–29), and Solomon built it in Jerusalem on Mount Moriah (2 Chr 3:1) as a permanent house for the ark and for God’s name (1 Kgs 5–7). At its dedication the glory cloud filled the house (1 Kgs 8:10–11). Solomon confessed that no building can contain God and asked him to hear prayer offered toward it, including the prayers of repentant exiles (8:27–53). The temple was the center of Israel’s worship and sacrifice and the sign of God’s presence with his people. Babylon destroyed it in 586 BC, and it was rebuilt after the exile, completed in 515 BC (Ezra 6:15)."]]],"q":"1 Kgs 8:27 | But will God indeed dwell on the earth? Behold, heaven and the highest heaven cannot contain you; how much less this house that I have built!","sc":"2 Sam 7:13; 1 Kgs 5–8; 2 Chr 2–7; Ezra 3–6; John 2:19–21; 4:21–24; 1 Cor 3:16; Eph 2:19–22; Rev 21:22","w":"WCF 2.1 (God is “immense,” proof: 1 Kgs 8:27) · WLC 7 “incomprehensible” (proof: 1 Kgs 8:27) · WLC 76 (repentance, proofs include 1 Kgs 8:47–48) · WCF 21.6 (worship is not now “tied unto, or made more acceptable by any place”)","c":"Jesus called his body the temple (John 2:19–21). In him God dwells with man, his people are being built into a holy temple (Eph 2:21–22), and in the new Jerusalem “its temple is the Lord God the Almighty and the Lamb” (Rev 21:22)."},{"n":35,"s":"I","t":"The Divided Kingdom","blocks":[["P",["When Solomon died, Rehoboam refused the people’s plea to lighten their burden, and the ten northern tribes made Jeroboam king (1 Kgs 12, c. 930 BC). God had announced the split through the prophet Ahijah as judgment on Solomon’s idolatry, while keeping one tribe for David’s sake (1 Kgs 11:29–39; 12:15). The northern kingdom, Israel, worshiped golden calves at Bethel and Dan, and “the sins of Jeroboam” became the refrain of its history. Its dynasties fell by assassination, and Assyria destroyed Samaria in 722 BC (2 Kgs 17). The southern kingdom, Judah, kept the Davidic line and the temple, had several reforming kings, and fell to Babylon in 586 BC (2 Kgs 25)."]]],"q":"1 Kgs 11:36 | Yet to his son I will give one tribe, that David my servant may always have a lamp before me in Jerusalem, the city where I have chosen to put my name.","sc":"1 Kgs 11:26–12:33; 14:16; 2 Kgs 17:7–23; 2 Chr 10–13; Ezek 37:15–28; Hos 1:11","w":"WCF 5.7 (providence “after a most special manner, it taketh care of his Church,” proofs include Amos 9:8–9) · WCF 5.4 (providence extends to “all other sins of angels and men”) · WCF 25.5 “there shall be always a Church on earth to worship God according to his will”","c":"The prophets promised one reunited people under one shepherd, David’s Son (Ezek 37:22–24). Christ gathers the scattered children of God into one (John 10:16; 11:52)."},{"n":36,"s":"I","t":"Ahab","blocks":[["P",["Ahab, son of Omri, ruled the northern kingdom in the mid-ninth century BC and did more evil than all the kings before him (1 Kgs 16:30). He married Jezebel of Sidon, built a temple and altar for Baal in Samaria, and let her persecute the LORD’s prophets. Elijah opposed him with the drought (1 Kgs 17:1), the contest on Mount Carmel where the LORD answered by fire (1 Kgs 18), and the sentence pronounced after Ahab and Jezebel murdered Naboth for his vineyard (1 Kgs 21). When Ahab humbled himself, God delayed the disaster (21:27–29). He died at Ramoth-gilead from an arrow drawn “at random,” as Micaiah had prophesied (1 Kgs 22:34–38)."]]],"q":"1 Kgs 18:21 | And Elijah came near to all the people and said, “How long will you go limping between two different opinions? If the LORD is God, follow him; but if Baal, then follow him.” And the people did not answer him a word.","sc":"1 Kgs 16:29–22:40; 2 Kgs 9:30–37; Rev 2:20","w":"WSC 81 (discontent and envy, proof: 1 Kgs 21:4) · WCF 16.7 (works of the unregenerate may be “of good use both to themselves and others,” proof: 1 Kgs 21:27, 29, yet they “cannot please God”) · WCF 5.2 (events fall out “contingently” under God’s providence, proof: 1 Kgs 22:28, 34) · WCF 5.4 (proof: 1 Kgs 22:22–23)","c":"Ahab is Scripture’s portrait of a divided heart. Elijah’s question still stands, and Jesus puts it the same way: no one can serve two masters (Matt 6:24)."},{"n":37,"s":"I","t":"Hezekiah","blocks":[["P",["Hezekiah, son of Ahaz, was one of Judah’s best kings (late eighth to early seventh century BC). He removed the high places, broke the bronze serpent Moses had made because Israel was burning incense to it (2 Kgs 18:4), and restored temple worship and the Passover (2 Chr 29–31). When Sennacherib of Assyria invaded and mocked the LORD, Hezekiah spread the letter before the LORD and prayed. Isaiah announced deliverance, and the angel of the LORD struck down the Assyrian army (2 Kgs 18–19; Isa 36–37). God healed his mortal illness and added fifteen years to his life (2 Kgs 20:1–11). Yet he proudly showed his treasures to Babylon’s envoys, and Isaiah foretold the Babylonian exile (20:12–19)."]]],"q":"2 Kgs 18:5 | He trusted in the LORD, the God of Israel, so that there was none like him among all the kings of Judah after him, nor among those who were before him.","sc":"2 Kgs 18–20; 2 Chr 29–32; Isa 36–39; Prov 25:1","w":"WCF 5.5 (God may leave his own children “for a season” to temptation, proof: 2 Chr 32:25–26, 31) · WLC 19 (God employs angels “in the administrations of his power, mercy, and justice,” proof: 2 Kgs 19:35) · WCF 5.4 (God’s “most wise and powerful bounding” of sin, proof: 2 Kgs 19:28)","c":"“God left him to himself, in order to test him and to know all that was in his heart” (2 Chr 32:31). Even the best son of David needed a better Son of David."},{"n":38,"s":"I","t":"Manasseh","blocks":[["P",["Manasseh, Hezekiah’s son, reigned fifty-five years, longer than any other king of Judah (2 Kgs 21:1). He undid his father’s reforms. He rebuilt the high places, erected altars for Baal, built altars for the host of heaven in the two courts of the temple, burned his son as an offering, practiced sorcery, and filled Jerusalem with innocent blood (21:2–16). Kings names his sins as the reason judgment on Judah became irreversible (2 Kgs 21:10–15; 23:26–27; 24:3–4). Chronicles adds that Assyrian commanders took him captive to Babylon, where he humbled himself and prayed, and God restored him to his throne, after which he removed the foreign gods (2 Chr 33:10–17)."]]],"q":"2 Chr 33:12–13 | And when he was in distress, he entreated the favor of the LORD his God and humbled himself greatly before the God of his fathers. He prayed to him, and God was moved by his entreaty and heard his plea and brought him again to Jerusalem into his kingdom. Then Manasseh knew that the LORD was God.","sc":"2 Kgs 21:1–18; 23:26–27; 24:3–4; 2 Chr 33:1–20; Jer 15:4","w":"WCF 15.4 “As there is no sin so small but it deserves damnation, so there is no sin so great that it can bring damnation upon those who truly repent” · WSC 87 · WCF 17.3 (grievous sins “bring temporal judgments upon themselves”)","c":"Manasseh shows both the depth of sin and the reach of grace. His forgiveness did not undo the national consequences his sins set in motion (2 Kgs 23:26), yet Christ came “to call ... sinners to repentance” (Luke 5:32), even the foremost (1 Tim 1:15)."},{"n":39,"s":"I","t":"Josiah","blocks":[["P",["Josiah became king at eight, after the assassination of his father Amon, and reigned thirty-one years (2 Kgs 21:23–22:1). While the temple was being repaired, the high priest Hilkiah found the Book of the Law (22:8). When it was read to him, Josiah tore his clothes, sought the LORD through the prophetess Huldah, and led the people in renewing the covenant (22:11–23:3). He purged idolatry from Judah and even from Bethel, fulfilling a prophecy that had named him three centuries earlier (1 Kgs 13:2; 2 Kgs 23:15–20), and kept a Passover unmatched since the days of the judges (23:21–23). No king turned to the LORD more fully. Yet wrath against Judah was not turned away (23:26–27), and he died at Megiddo opposing Pharaoh Neco (23:29)."]]],"q":"2 Kgs 23:25 | Before him there was no king like him, who turned to the LORD with all his heart and with all his soul and with all his might, according to all the Law of Moses, nor did any like him arise after him.","sc":"2 Kgs 22:1–23:30; 2 Chr 34–35; Jer 1:1–2; 22:15–16","w":"WCF 15.2 (repentance turns to God “purposing and endeavoring to walk with him,” proof: 2 Kgs 23:25) · WLC 76 (proof: 2 Kgs 23:25) · WSC 89 “The Spirit of God maketh the reading, but especially the preaching, of the Word, an effectual means of convincing and converting sinners”","c":"Reform driven by the recovered Word was real but could not change the nation’s heart. Jeremiah, who began prophesying in Josiah’s thirteenth year (Jer 1:2), announced the new covenant that would (Jer 31:31–34)."},{"n":40,"s":"I","t":"Major Differences between 1 and 2 Kings and 1 and 2 Chronicles","blocks":[["P",["The two histories cover overlapping ground for different audiences and purposes. Both are inspired and true, and each selects and arranges its material to make its own point."]],["T",["| 1–2 Kings | 1–2 Chronicles","Setting | Written in exile. The last event is Jehoiachin’s release, c. 561 BC (2 Kgs 25:27–30). | Written after the return. It closes with Cyrus’s decree, 538 BC (2 Chr 36:22–23).","Question answered | Why did the kingdom fall and the exile come? | Who are we now, and are God’s promises to David still ours?","Scope | David’s last days and Solomon’s accession through the exile, with both kingdoms told in parallel. | Genealogies from Adam (1 Chr 1–9), then Saul’s death through the exile, centered on Judah and David’s line.","Northern kingdom | Told in full, with its fall explained (2 Kgs 17). | Mostly omitted except where it touches Judah.","Viewpoint | Prophetic: Elijah, Elisha, and the prophetic word fulfilled. | Priestly: temple, Levites, music, Passover, and right worship.","David and Solomon | Opens with David’s old age, Adonijah’s bid for the throne, and Solomon’s removal of rivals (1 Kgs 1–2), and records Solomon’s apostasy (1 Kgs 11). | Omits the succession struggle and Solomon’s apostasy, as well as David’s sin with Bathsheba and Absalom’s revolt (told in 2 Sam 11–18). Stresses David’s preparations for the temple (1 Chr 22–29) and keeps David’s census because it leads to the temple site (1 Chr 21:1–22:1).","Distinctives | Kings are measured by “the sins of Jeroboam” and Deuteronomy’s standard. | Blessing for seeking God and judgment for forsaking him come promptly (2 Chr 7:14; 15:2). Only Chronicles records Hezekiah’s Passover (2 Chr 30) and Manasseh’s repentance (2 Chr 33).","Final note | Jehoiachin freed from prison, a flicker of hope for David’s line. | “Let him go up,” the call to return and rebuild."]]],"q":"2 Chr 7:14 | if my people who are called by my name humble themselves, and pray and seek my face and turn from their wicked ways, then I will hear from heaven and will forgive their sin and heal their land.","sc":"2 Kgs 25:27–30; 1 Chr 1–9; 21:1–22:1; 2 Chr 7:14; 15:2; 30; 33:10–17; 36:20–23","w":"WCF 1.5 (“the consent of all the parts” among the marks of Scripture’s divinity) · WCF 1.9 “when there is a question about the true and full sense of any scripture ... it must be searched and known by other places that speak more clearly”","c":"Both histories end in hope that rests on God’s promise to David, fulfilled in Christ (Matt 1:1, 11–12)."},{"n":41,"s":"I","t":"The Babylonian Exile","blocks":[["P",["Judah went into exile in stages: in 605 BC (Daniel and others, Dan 1:1–6), in 597 BC (King Jehoiachin and the leading citizens, 2 Kgs 24:10–16, Ezekiel among them, Ezek 1:1–3), and in 586 BC, when Nebuchadnezzar destroyed Jerusalem and the temple (2 Kgs 25). It was the covenant curse Moses had threatened (Deut 28:36, 64), sent after long patience with prophets whom Judah mocked (2 Chr 36:15–16). Jeremiah set its length at seventy years (Jer 25:11–12; 29:10), while the land enjoyed its Sabbaths (2 Chr 36:21). In Babylon God preserved a remnant. He told the exiles to seek the city’s welfare (Jer 29:4–7), raised up Daniel and Ezekiel, and promised a new exodus. Cyrus’s decree of 538 BC opened the return (Ezra 1:1–4), as Isaiah had foretold by name (Isa 44:28; 45:1)."]]],"q":"Jer 29:7 | But seek the welfare of the city where I have sent you into exile, and pray to the LORD on its behalf, for in its welfare you will find your welfare.","sc":"Deut 28:36, 64; 2 Kgs 24–25; 2 Chr 36:15–23; Ps 137; Jer 25:11–12; 29:4–14; Ezek 37:1–14; Dan 1:1–6; 9:1–19","w":"WCF 5.7 (special providence over the church, proofs include Isa 43:3–5, 14 and Amos 9:8–9) · WCF 25.5 “there shall be always a Church on earth to worship God according to his will” · WLC 28 (punishments of sin in this world)","c":"Matthew structures Jesus’ genealogy around the deportation to Babylon (Matt 1:11–12, 17). Believers now live as “elect exiles” (1 Pet 1:1) awaiting the final homecoming."},{"n":42,"s":"I","t":"Zerubbabel","blocks":[["P",["Zerubbabel, grandson of King Jehoiachin and heir of David’s line (1 Chr 3:17–19; Matt 1:12), led the first return from Babylon with Jeshua the high priest (Ezra 2:2) and served as governor of Judah (Hag 1:1). They rebuilt the altar and laid the temple’s foundation (Ezra 3). Local opposition halted the work for years (Ezra 4) until the prophets Haggai and Zechariah stirred Zerubbabel and the people to resume (Ezra 5:1–2; Hag 1:12–15). The temple was completed in 515 BC (Ezra 6:15). The new house looked like nothing beside Solomon’s (Hag 2:3), but God promised its latter glory would be greater (2:9). God called Zerubbabel his chosen “signet ring” (Hag 2:23), reversing his rejection of Jehoiachin (Jer 22:24)."]]],"q":"Zech 4:6 | Then he said to me, “This is the word of the LORD to Zerubbabel: Not by might, nor by power, but by my Spirit, says the LORD of hosts.","sc":"Ezra 1–6; Hag 1–2; Zech 4:6–10; 1 Chr 3:17–19; Jer 22:24–30; Matt 1:12–13; Luke 3:27","w":"WCF 5.7 (God’s special care of his church) · WCF 7.5 (the covenant “administered by promises, prophecies” that fore-signified Christ) · WCF 25.5","c":"Through Zerubbabel God kept David’s line alive after the exile, and he stands in both of Jesus’ genealogies (Matt 1:12; Luke 3:27). The greater glory Haggai promised came when the Lord came to his temple (Hag 2:7–9; Mal 3:1)."},{"n":43,"s":"I","t":"Ezra","blocks":[["P",["Ezra was a priest descended from Aaron and “a scribe skilled in the Law of Moses” (Ezra 7:1–6). He led a second return from Babylon in 458 BC, the seventh year of Artaxerxes (7:7–8), with the king’s authority to teach and enforce God’s law. Finding that many, leaders included, had married pagan wives, he tore his garments, confessed the people’s sin in prayer (Ezra 9), and led them to put away those marriages (Ezra 10). With Nehemiah he later read the Law publicly while the Levites explained it, which brought mourning, joy, confession, and covenant renewal (Neh 8–10). Ezra models reformation by the Word, in which the leader first studies it, then obeys it, then teaches it."]]],"q":"Ezra 7:10 | For Ezra had set his heart to study the Law of the LORD, and to do it and to teach his statutes and rules in Israel.","sc":"Ezra 7–10; Neh 8:1–18; 12:26, 36; Mal 2:7","w":"WSC 89 (proof: Neh 8:8) · WLC 157 (Scripture is to be read “with diligence, and attention to the matter and scope of them”) · WCF 24.3 “it is the duty of Christians to marry only in the Lord” · WCF 21.5 “The reading of the Scriptures with godly fear”","c":"Ezra’s order of study, obedience, and teaching is a pattern for church officers (1 Tim 3:9; 4:16; Titus 1:9)."},{"n":44,"s":"I","t":"Nehemiah","blocks":[["P",["Nehemiah was cupbearer to the Persian king Artaxerxes. Hearing that Jerusalem’s walls lay in ruins, he mourned, fasted, and prayed (Neh 1), then received the king’s leave to go as governor in 445 BC (Neh 2:1–8). He organized families to rebuild sections of the wall and kept working under threat from Sanballat, Tobiah, and Geshem, with half the men building and half standing guard (Neh 4). The wall was finished in fifty-two days (6:15). He ended the nobles’ exploitation of poor Jews (Neh 5) and, with Ezra, led covenant renewal (Neh 8–10). On a later visit he reformed abuses again. He restored the Levites’ support and appointed reliable men to distribute to their brothers (13:10–13), enforced the Sabbath, and opposed mixed marriages (Neh 13)."]]],"q":"Neh 6:15–16 | So the wall was finished on the twenty-fifth day of the month Elul, in fifty-two days. And when all our enemies heard of it, all the nations around us were afraid and fell greatly in their own esteem, for they perceived that this work had been accomplished with the help of our God.","sc":"Neh 1–13; Ezra 4:7–23; Ps 127:1; Mal 3:1","w":"WCF 21.8 (Sabbath keeping, proofs include Neh 13:15–22) · WSC 60 (proofs include Neh 13:15–19, 21–22) · WCF 24.3 (proofs include Neh 13:25–27) · WLC 142 (among sins against the eighth commandment, “oppression, extortion, usury”)","c":"Nehemiah joined prayer and work, guarded the poor, and restored right worship. Neh 13:10–13 is an early picture of diaconal stewardship, trustworthy men appointed to distribute to their brothers (compare Acts 6:1–6). Yet the backsliding of Neh 13 shows that walls and reforms cannot renew hearts, and the Old Testament closes waiting for the Lord to come to his temple (Mal 3:1)."},{"n":45,"s":"II","t":"Two prophets who ministered during the United Kingdom","blocks":[["P",["Nathan delivered the Davidic covenant (2 Sam 7:1–17), confronted David over Bathsheba with the parable of the ewe lamb and the verdict “You are the man!” (2 Sam 12:1–15), and secured Solomon’s succession (1 Kgs 1). Gad, “David’s seer,” counseled David while he was a fugitive (1 Sam 22:5) and brought God’s word after the census, directing him to build the altar on the threshing floor that became the temple site (2 Sam 24:11–25). Also acceptable: Samuel, who anointed Saul and David (1 Sam 10; 16), and Ahijah the Shilonite, who announced the division of the kingdom in Solomon’s reign (1 Kgs 11:29–39)."]]],"a":"Nathan and Gad","sc":"1 Sam 22:5; 2 Sam 7; 12; 24:11–25; 1 Kgs 1; 1 Chr 29:29"},{"n":46,"s":"II","t":"The two most significant prophets identified in 1 and 2 Kings","blocks":[["P",["Elijah confronted the Baal worship of Ahab and Jezebel, announced the drought, defeated the prophets of Baal on Mount Carmel, heard the LORD in “the sound of a low whisper” at Horeb, and was taken up to heaven in a whirlwind (1 Kgs 17–19; 21; 2 Kgs 1–2). Elisha received a double portion of his spirit (2 Kgs 2:9–15) and carried on a long ministry of miracles, including raising the Shunammite’s son and healing Naaman the Syrian, and he set in motion the fall of Ahab’s house by having Jehu anointed (2 Kgs 2–9; 13). Together they kept a faithful remnant alive in the darkest era of the northern kingdom (1 Kgs 19:18). Malachi promised Elijah’s return (Mal 4:5–6), fulfilled in John the Baptist (Matt 11:14), and Jesus pointed to both men’s ministries to Gentiles (Luke 4:25–27)."]]],"a":"Elijah and Elisha","sc":"1 Kgs 17 – 2 Kgs 13; Mal 4:5–6; Matt 11:14; 17:1–13; Luke 4:25–27; Jas 5:17–18"},{"n":47,"s":"II","t":"Two “writing prophets” whose ministry focused on the Northern Kingdom of Israel","blocks":[["P",["Amos, a herdsman from Tekoa in Judah, was sent north in the days of Jeroboam II (Amos 1:1; 7:14–15). Israel was prosperous, and he indicted its luxury, oppression of the poor, and empty worship, calling for justice to “roll down like waters” (5:24). He announced exile “beyond Damascus” (5:27) and closed with the promise that God would raise up “the booth of David” (9:11–12, quoted in Acts 15:16–17). Hosea prophesied to the northern kingdom in the same era. God commanded him to marry Gomer, who proved unfaithful, so that his marriage would picture Israel’s spiritual adultery and God’s relentless love (Hos 1–3; 11:8–9). Jonah also came from the north (2 Kgs 14:25), though his recorded mission was to Nineveh."]]],"a":"Amos and Hosea","sc":"Amos 1:1; 5:21–27; 7:10–17; 9:11–15; Hos 1–3; 6:6; 11:1–9; 14:1–9; 2 Kgs 14:23–27"},{"n":48,"s":"II","t":"Two “writing prophets” whose work focused primarily on the Southern Kingdom of Judah","blocks":[["P",["Isaiah prophesied in Jerusalem from the year King Uzziah died through Hezekiah’s reign (Isa 1:1; 6:1). He called Judah to trust the Holy One of Israel rather than foreign alliances (Isa 7; 30–31), stood with Hezekiah against Assyria (Isa 36–37), and foretold both the exile to Babylon and the return under Cyrus (Isa 39; 44:28–45:1). His book holds the fullest Old Testament portrait of the coming King and the Suffering Servant (Isa 7:14; 9:6–7; 11; 52:13–53:12). Jeremiah prophesied from Josiah’s thirteenth year to the fall of Jerusalem and beyond (Jer 1:1–3). He called Judah to submit to Babylon as God’s judgment, suffered rejection and imprisonment, and announced the seventy years and the new covenant (Jer 25:11; 31:31–34). Micah, Joel, Habakkuk, and Zephaniah also fit."]]],"a":"Isaiah and Jeremiah","sc":"Isa 1:1; 6:1–13; 7:1–17; 36–39; 53; Jer 1:1–19; 7:1–15; 25:1–14; 31:31–34; 37–39"},{"n":49,"s":"II","t":"Two “writing prophets” whose ministry focused on the sins of other nations","blocks":[["P",["Obadiah, the shortest Old Testament book, pronounces judgment on Edom for its pride and for gloating over and plundering Jerusalem in its day of disaster (Obad 3, 10–14). It ends, “and the kingdom shall be the LORD’s” (v. 21). Nahum announces the fall of Nineveh, the Assyrian capital, for its cruelty, idolatry, and violence (Nah 1:1; 3:1–7). Nineveh fell in 612 BC. Jonah is also acceptable, since he was sent to Nineveh because its evil had come up before God (Jonah 1:2), though his book centers on God’s mercy to the nations and to his reluctant prophet. Isaiah, Jeremiah, Ezekiel, and Amos also contain oracles against the nations."]]],"a":"Obadiah and Nahum","sc":"Obad 1–21; Nah 1–3; Jonah 1:2; 3:1–4:11; Isa 13–23; Jer 46–51; Ezek 25–32; Amos 1:3–2:3"},{"n":50,"s":"II","t":"Two “writing prophets” whose ministry was post-exilic and focused on the issues surrounding the return from exile","blocks":[["P",["Both prophesied in 520 BC, the second year of Darius, to the returned community (Hag 1:1; Zech 1:1). Haggai rebuked the people for living in paneled houses while God’s house lay in ruins (Hag 1:2–11). When they obeyed, he encouraged them that God was with them and that the latter glory of the house would surpass the former (Hag 1:12–2:9). Zechariah’s night visions and oracles assured the builders that God had returned to Jerusalem, that the work would be finished “not by might, nor by power, but by my Spirit” (Zech 4:6), and that Zion’s King would come humble and “mounted on a donkey” (Zech 9:9). Malachi, later in the fifth century, also addressed the restored community, rebuking corrupt priests, faithless marriages, and withheld tithes (Mal 1–3)."]]],"a":"Haggai and Zechariah","sc":"Ezra 5:1–2; 6:14; Hag 1–2; Zech 1–14; Mal 1–4"},{"n":51,"s":"II","t":"Repentance","blocks":[["P",["The prophets’ constant call is to “return” (Hebrew shuv) to the LORD with the whole heart. Repentance is more than outward ritual or sorrow over consequences. It is turning from sin to God, rending the heart rather than the garments, and it rests on God’s revealed mercy. The prophets insist that repentance show itself in changed conduct, especially justice and mercy toward the weak (Isa 1:16–17; Mic 6:8). They also teach that true repentance is God’s gift. He must turn his people for them to be turned (Jer 31:18–19; Lam 5:21; Ezek 36:26–31)."]]],"q":"Joel 2:13 | and rend your hearts and not your garments.” Return to the LORD your God, for he is gracious and merciful, slow to anger, and abounding in steadfast love; and he relents over disaster.","sc":"Isa 1:16–18; 55:6–7; Jer 3:12–14, 22; Ezek 18:30–32; Hos 6:1–3; 14:1–2; Joel 2:12–13; Jonah 3:5–10; Zech 1
